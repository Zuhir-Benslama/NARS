apiVersion: v1
kind: ConfigMap
metadata:
  name: nars-config
  namespace: nars
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  # Override appsettings Cors:AllowedOrigins at runtime.
  Cors__AllowedOrigins__0: "http://localhost:5000"
  Cors__AllowedOrigins__1: "http://localhost:5001"
  Cors__AllowedOrigins__2: "https://localhost:7000"
  Cors__AllowedOrigins__3: "https://localhost:7001"
  Cors__AllowedOrigins__4: "http://localhost:5173"
  Cors__AllowedOrigins__5: "https://api.nars.dz"
