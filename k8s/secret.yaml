apiVersion: v1
kind: Secret
metadata:
  name: nars-secrets
  namespace: nars
type: Opaque
stringData:
  # 🚨 IMPORTANT: Replace these values before deploying to any environment.
  # Use `kubectl create secret generic nars-secrets --namespace=nars --from-literal=postgres_password=...`
  # or a secrets manager (SealedSecrets, External Secrets Operator, Vault).
  postgres_password: "change-me-postgres-password"
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=nars_db;Username=postgres;Password=change-me-postgres-password"
  Jwt__SecretKey: "change-me-jwt-secret-at-least-32-characters-long-for-hmac-sha256"
---
apiVersion: v1
kind: Secret
metadata:
  name: regcred
  namespace: nars
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"https://index.docker.io/v1/":{"username":"your-docker-username","password":"your-docker-token","auth":"<base64-encoded-username:password>"}}}'
