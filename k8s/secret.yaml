apiVersion: v1
kind: Secret
metadata:
  name: nars-secrets
  namespace: nars
type: Opaque
stringData:
  # Update these values before deploying.
  postgres_password: "change-me"
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=nars_db;Username=postgres;Password=change-me"
  Jwt__SecretKey: "change-this-secret-key-in-production"
