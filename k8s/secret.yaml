apiVersion: v1
kind: Secret
metadata:
  name: nars-secrets
  namespace: nars
type: Opaque
stringData:
  # Update these values before deploying.
  postgres_password: "CHANGE_ME_POSTGRES_PASSWORD"
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=nars_db;Username=postgres;Password=CHANGE_ME_POSTGRES_PASSWORD"
  Jwt__SecretKey: "CHANGE_ME_JWT_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: regcred
  namespace: nars
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"https://index.docker.io/v1/":{"username":"zuhirbenslama","password":"change-me","auth":"<base64-encoded-username:password>"}}}
