apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nars-api
  namespace: nars
spec:
  rules:
    - host: nars.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nars-api
                port:
                  number: 80
