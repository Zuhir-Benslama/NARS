apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nars
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: nars
      app.kubernetes.io/managed-by: kustomize
resources:
  - namespace.yaml
  - configmap.yaml
  # ── Secrets ───────────────────────────────────────────────────────────────
  # secret.yaml is a REFERENCE TEMPLATE only. Real secrets are created at
  # deploy time by `make secrets-apply` (generates random values via openssl).
  #   make secrets-apply   ← creates nars-secrets + regcred
  #   make tls-generate    ← creates nars-tls TLS certificate
  #   make ca-secret       ← creates nars-ca for mTLS
  # postgis-pv.yaml (static hostPath PV) replaced by dynamic provisioning via local-path StorageClass
  - postgis.yaml
  - app-deployment.yaml
  - app-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress-api.yaml
  - ingress-frontend.yaml
  - service-account.yaml
  - network-policy.yaml
  - resource-quota.yaml
  - hpa.yaml
  - pdb.yaml
  - backup-cronjob.yaml
  - otel-metrics-service.yaml
  - servicemonitor.yaml
images:
  # ⚠ `latest` tags are for local dev. For CI/CD, override newTag with
  # the commit SHA or build number:
  #   kustomize edit set image zuhirbenslama/nars-api=ghcr.io/org/nars-api:abc1234
  - name: zuhirbenslama/nars-api
    newTag: latest
  - name: zuhirbenslama/nars-postgis
    newTag: latest
  - name: zuhirbenslama/nars-vite
    newTag: latest
