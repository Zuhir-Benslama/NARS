apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgis-pvc
  namespace: nars
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 10Gi
  volumeName: postgis-pv
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgis
  namespace: nars
  labels:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgis
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgis
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: postgis
      securityContext:
        fsGroup: 999
      containers:
        - name: postgis
          image: zuhirbenslama/nars-postgis:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: nars_db
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nars-secrets
                  key: postgres_password
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - nars_db
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - nars_db
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - nars_db
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - SETUID
                - SETGID
                - FOWNER
              drop:
                - ALL
          volumeMounts:
            - name: postgis-data
              mountPath: /var/lib/postgresql/data
            - name: postgis-run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: postgis-data
          persistentVolumeClaim:
            claimName: postgis-pvc
        - name: postgis-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgis
  namespace: nars
  labels:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/component: database
spec:
  selector:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/component: database
  ports:
    - port: 5432
      targetPort: 5432
