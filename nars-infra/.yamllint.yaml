---
extends: default

rules:
  line-length:
    max: 120
    allow-non-breakable-inline-mappings: true
    allow-non-breakable-words: true
    level: warning

  indentation:
    spaces: 2
    indent-sequences: consistent
    check-multi-line-strings: false

  comments:
    min-spaces-from-content: 1
    level: warning

  document-start:
    present: true
    level: warning

  truthy:
    # GitHub Actions workflows use `on:` as the event trigger key, which the
    # YAML 1.1 spec parses as a boolean scalar. That is not a lintable truthy
    # value, so stop flagging mapping keys (values are still checked).
    check-keys: false
