---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nars-segma
  # Explicit so standalone `kubectl apply -f nars-infra/segma/` also lands in
  # nars (matches the parent kustomization, which applies the same namespace).
  namespace: nars
  labels:
    app.kubernetes.io/name: nars-segma
    app.kubernetes.io/component: segmentation
    app.kubernetes.io/version: "latest"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nars-segma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nars-segma
        app.kubernetes.io/component: segmentation
    spec:
      # No cluster API access is needed — do not mount the default SA token.
      serviceAccountName: nars-segma
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Must match USER in docker/Dockerfile.nars-segma (10001)
        runAsUser: 10001
        fsGroup: 10001
      initContainers:
        - name: fetch-weights
          # Pulls the model checkpoint from NARS_SEGMA_WEIGHTS_URL into a
          # shared emptyDir. Fails the init (CrashLoopBackOff) instead of
          # letting the pod sit NotReady forever when weights can't be fetched,
          # so the cause is visible in `kubectl describe pod`.
          # Digest-pinned (multi-arch index) like the other image refs.
          image: curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ -z "$NARS_SEGMA_WEIGHTS_URL" ]; then
                echo "NARS_SEGMA_WEIGHTS_URL is not set; cannot fetch weights" >&2
                exit 1
              fi
              curl --fail --silent --show-error --location \
                "$NARS_SEGMA_WEIGHTS_URL" -o /srv/weights/unet_bldg_base.pth
              ls -lh /srv/weights
          env:
            - name: NARS_SEGMA_WEIGHTS_URL
              valueFrom:
                secretKeyRef:
                  name: nars-segma-secrets
                  key: weights-url
                  optional: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: weights
              mountPath: /srv/weights
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
        - name: seed-road-weights
          # Copies the roads checkpoint (DeepLabV3+/ConvNeXt-Tiny, trained on
          # commune-validated drafts) out of the image layer into the emptyDir
          # at /srv/weights. It is baked at /srv/weights-baked precisely
          # because the /srv/weights mount hides /srv/weights in the image.
          #
          # This used to download the checkpoint from the `road-weights-url`
          # secret instead, but that URL pointed at the raw SpaceNet champion
          # *pickle* (pytorch_zoo.unet.Resnet34_upsample) while the builder is
          # deeplabv3p-convnext. torch.load(weights_only=True) rejected it with
          # UnpicklingError, the task was left unregistered, and every
          # /segment/roads request returned 503 while /health still reported
          # model_loaded:true from the buildings task. Serving from the image
          # removes both the mismatch and the 94MB-per-start download.
          image: zuhirbenslama/nars-segma:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              src=/srv/weights-baked/roads_dlv3p_convnext_tiny.pth
              dst=/srv/weights/roads_best.pth
              if [ ! -f "$src" ]; then
                echo "roads checkpoint missing from image at $src" >&2
                echo "weights/*.pth is gitignored: place the checkpoint in" >&2
                echo "nars-segma/weights/ before building the image" >&2
                exit 1
              fi
              cp "$src" "$dst"
              ls -lh /srv/weights
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: weights
              mountPath: /srv/weights
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      containers:
        - name: nars-segma
          # ⚠ Dev default only — override via kustomize in CI/CD (e.g.
          # kustomize edit set image zuhirbenslama/nars-segma=ghcr.io/org/nars-segma:<sha>).
          image: zuhirbenslama/nars-segma:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: NARS_SEGMA_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nars-segma-secrets
                  key: internal-token
            - name: NARS_SEGMA_WEIGHTS_PATH
              value: /srv/weights/unet_bldg_base.pth
            - name: NARS_SEGMA_ROAD_WEIGHTS_PATH
              value: /srv/weights/roads_best.pth
            # Roads model = DeepLabV3+/ConvNeXt-Tiny trained on commune-
            # validated drafts (nars-roads/, timm==0.9.7). The builder flag
            # selects it over the legacy SpaceNet resnet34-upsample; weights
            # come from the seed-road-weights initContainer, which copies the
            # plain state_dict baked into the image (safe weights_only load).
            - name: NARS_SEGMA_ROAD_BUILDER
              value: deeplabv3p-convnext
            # Road rules (limitation). The minimum length floor is 0: segma
            # cannot see the commune's mapped network, so whether a short edge
            # is a keepable junction stub or a deleteable isolated spur is the
            # API's roads-phase rules' decision (which do see it). Confidence
            # drops weak detections; the per-tile cap bounds how many drafts a
            # single acceptance creates.
            - name: NARS_SEGMA_ROAD_MIN_LENGTH_M
              value: "0"
            # The confidence floor is the road quality lever that matters. At 0
            # the service emitted 53% of its drafts under 10 m - median 3.1 m,
            # median confidence 0.49, barely over the 0.5 mask threshold. Those
            # marginal spurs are what made drafts look like roads crossing each
            # other, not the roads themselves. Measured on the commune's 1,837
            # road drafts: floor 0.6 -> 959 drafts, median 38 m, 25% under 10 m,
            # blind crossings 3,196 -> 2,248, keeping 91% of network length;
            # floor 0.7 -> 733 drafts, median 56 m, 17% under 10 m, crossings
            # 1,399, keeping 85%. Start at 0.6 and tighten only after eyeballing
            # a tile - each step discards real low-confidence road. Deliberately
            # no length floor: a short edge is the API's roads-phase decision,
            # not segma's, because only the API sees the mapped network.
            - name: NARS_SEGMA_ROAD_MIN_CONFIDENCE
              value: "0.6"
            - name: NARS_SEGMA_ROAD_MAX_FEATURES
              value: "0"
            # Road network cleanup. The skeleton centerlines of ~20 m/px
            # imagery wobble between neighbouring pixels (visible as small
            # dents) and two roads that cross are independent LineStrings that
            # intersect mid-segment with no shared node. The angle/deviation
            # pair straightens the dents (see app/roadnet.py). Set either to 0
            # to disable that pass.
            - name: NARS_SEGMA_ROAD_NET_MAX_ANGLE_DEG
              value: "20"
            - name: NARS_SEGMA_ROAD_NET_MAX_DEVIATION_RATIO
              value: "0.30"
            # Noding is OFF. It works (blind crossings 1574 -> 17 on the
            # commune's drafts) but every cut is a new fragment, and these
            # drafts are already fragments - median 9.1 m, 51.7% already under
            # the API's 10 m MinRoadLengthM floor. Noding drops the median to
            # 3.1 m and puts 72% of pieces under that floor, which the API's
            # roads-phase rules then delete, tearing apart the junctions the
            # pass just created. The API's topology pass assembles the network,
            # so the crossing work belongs there. Set >0 to enable.
            - name: NARS_SEGMA_ROAD_NET_NODE_TOLERANCE_M
              value: "0"
            # Only crossings this sharp are noded, and only once a non-zero
            # tolerance is set. Shallower ones are twin centrelines of the same
            # road traced a few metres apart, not a junction.
            - name: NARS_SEGMA_ROAD_NET_MIN_NODE_ANGLE_DEG
              value: "20"
            # Building rules (limitation) — same shape as the roads rules;
            # the confidence floor drops ghost rooftops, the cap bounds the
            # number of building drafts per tile.
            - name: NARS_SEGMA_BUILDING_MIN_CONFIDENCE
              value: "0"
            - name: NARS_SEGMA_BUILDING_MAX_FEATURES
              value: "0"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability:4317"
            - name: OTEL_SERVICE_NAME
              value: "nars-segma"
            - name: TMPDIR
              value: /tmp
            # readOnlyRootFilesystem makes the image's /home/nars-segma (and any
            # ~/.cache) read-only. Point HOME at the writable emptyDir so tools
            # that write user caches (e.g. torch, GDAL) don't fail at runtime.
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
              # The road/building models are CUDA-only and fail closed without
              # CUDA, so this pod MUST land on the GPU node. The device plugin
              # (installed by gpu-install) advertises nvidia.com/gpu on the
              # kind control-plane node; a CPU-only cluster cannot schedule it.
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temp
              mountPath: /tmp
            - name: weights
              mountPath: /srv/weights
          # Gates readiness/liveness until the model is loaded, so a slow
          # startup (torch import + checkpoint load) can't trip the liveness
          # probe and restart the pod. 5s × 60 failures ≈ 5 min budget.
          startupProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        # Bounded so a runaway cache (torch/GDAL write under HOME=/tmp) or a
        # huge checkpoint can't fill the node's disk. Weights headroom allows
        # for larger checkpoints than today's ResNet34 UNet.
        - name: temp
          emptyDir:
            sizeLimit: 2Gi
        - name: weights
          emptyDir:
            sizeLimit: 2Gi
