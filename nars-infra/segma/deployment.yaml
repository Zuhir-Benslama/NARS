---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nars-segma
  # Explicit so standalone `kubectl apply -f nars-infra/segma/` also lands in
  # nars (matches the parent kustomization, which applies the same namespace).
  namespace: nars
  labels:
    app.kubernetes.io/name: nars-segma
    app.kubernetes.io/component: segmentation
    app.kubernetes.io/version: "latest"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nars-segma
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nars-segma
        app.kubernetes.io/component: segmentation
    spec:
      # No cluster API access is needed — do not mount the default SA token.
      serviceAccountName: nars-segma
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Must match USER in docker/Dockerfile.nars-segma (10001)
        runAsUser: 10001
        fsGroup: 10001
      initContainers:
        - name: fetch-weights
          # Pulls the model checkpoint from NARS_SEGMA_WEIGHTS_URL into a
          # shared emptyDir. Fails the init (CrashLoopBackOff) instead of
          # letting the pod sit NotReady forever when weights can't be fetched,
          # so the cause is visible in `kubectl describe pod`.
          # Digest-pinned (multi-arch index) like the other image refs.
          image: curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ -z "$NARS_SEGMA_WEIGHTS_URL" ]; then
                echo "NARS_SEGMA_WEIGHTS_URL is not set; cannot fetch weights" >&2
                exit 1
              fi
              curl --fail --silent --show-error --location \
                "$NARS_SEGMA_WEIGHTS_URL" -o /srv/weights/unet_bldg_base.pth
              ls -lh /srv/weights
          env:
            - name: NARS_SEGMA_WEIGHTS_URL
              valueFrom:
                secretKeyRef:
                  name: nars-segma-secrets
                  key: weights-url
                  optional: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: weights
              mountPath: /srv/weights
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
        - name: fetch-road-weights
          # Pulls the raw SpaceNet 3 champion roads checkpoint (a pickled
          # model, not a state_dict) into /srv/weights for the conversion
          # initContainer. Fail-safe like fetch-weights.
          image: curlimages/curl:8.10.1@sha256:d9b4541e214bcd85196d6e92e2753ac6d0ea699f0af5741f8c6cccbfcf00ef4b
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ -z "$NARS_SEGMA_ROAD_WEIGHTS_URL" ]; then
                echo "NARS_SEGMA_ROAD_WEIGHTS_URL is not set; cannot fetch road weights" >&2
                exit 1
              fi
              curl --fail --silent --show-error --location \
                "$NARS_SEGMA_ROAD_WEIGHTS_URL" -o /srv/weights/fold0_best.pth
              ls -lh /srv/weights
          env:
            - name: NARS_SEGMA_ROAD_WEIGHTS_URL
              valueFrom:
                secretKeyRef:
                  name: nars-segma-secrets
                  key: road-weights-url
                  optional: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: weights
              mountPath: /srv/weights
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
        - name: convert-roads-weights
          # The SpaceNet roads checkpoint is a legacy pickled model object; the
          # serving image only loads plain state_dicts (weights_only=True,
          # ref app/scripts/convert_roads.py). Convert once here so the main
          # container never touches untrusted pickle bytes. Runs in the app
          # image (has torch) after fetch-road-weights completes. This script
          # runs offline, so a malicious pickle has no network or secrets.
          image: zuhirbenslama/nars-segma:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.scripts.convert_roads"]
          args:
            - --input
            - /srv/weights/fold0_best.pth
            - --output
            - /srv/weights/roads_best.pth
          env:
            - name: TMPDIR
              value: /tmp
            - name: HOME
              value: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: weights
              mountPath: /srv/weights
            - name: temp
              mountPath: /tmp
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      containers:
        - name: nars-segma
          # ⚠ Dev default only — override via kustomize in CI/CD (e.g.
          # kustomize edit set image zuhirbenslama/nars-segma=ghcr.io/org/nars-segma:<sha>).
          image: zuhirbenslama/nars-segma:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: NARS_SEGMA_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nars-segma-secrets
                  key: internal-token
            - name: NARS_SEGMA_WEIGHTS_PATH
              value: /srv/weights/unet_bldg_base.pth
            - name: NARS_SEGMA_ROAD_WEIGHTS_PATH
              value: /srv/weights/roads_best.pth
            # Road rules (limitation) — discard below these before features
            # reach the API: a minimum geodesic length (metres) forbids the
            # stub spurs skeletonization emits at tile edges, a minimum
            # confidence drops weak detections, and the per-tile cap bounds
            # how many drafts a single acceptance creates.
            - name: NARS_SEGMA_ROAD_MIN_LENGTH_M
              value: "0"
            - name: NARS_SEGMA_ROAD_MIN_CONFIDENCE
              value: "0"
            - name: NARS_SEGMA_ROAD_MAX_FEATURES
              value: "0"
            # Building rules (limitation) — same shape as the roads rules;
            # the confidence floor drops ghost rooftops, the cap bounds the
            # number of building drafts per tile.
            - name: NARS_SEGMA_BUILDING_MIN_CONFIDENCE
              value: "0"
            - name: NARS_SEGMA_BUILDING_MAX_FEATURES
              value: "0"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability:4317"
            - name: OTEL_SERVICE_NAME
              value: "nars-segma"
            - name: TMPDIR
              value: /tmp
            # readOnlyRootFilesystem makes the image's /home/nars-segma (and any
            # ~/.cache) read-only. Point HOME at the writable emptyDir so tools
            # that write user caches (e.g. torch, GDAL) don't fail at runtime.
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temp
              mountPath: /tmp
            - name: weights
              mountPath: /srv/weights
          # Gates readiness/liveness until the model is loaded, so a slow
          # startup (torch import + checkpoint load) can't trip the liveness
          # probe and restart the pod. 5s × 60 failures ≈ 5 min budget.
          startupProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        # Bounded so a runaway cache (torch/GDAL write under HOME=/tmp) or a
        # huge checkpoint can't fill the node's disk. Weights headroom allows
        # for larger checkpoints than today's ResNet34 UNet.
        - name: temp
          emptyDir:
            sizeLimit: 2Gi
        - name: weights
          emptyDir:
            sizeLimit: 2Gi
