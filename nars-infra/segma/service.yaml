---
apiVersion: v1
kind: Service
metadata:
  name: nars-segma
  # Explicit so standalone `kubectl apply -f nars-infra/segma/` also lands in
  # nars (matches the parent kustomization, which applies the same namespace).
  namespace: nars
  labels:
    app.kubernetes.io/name: nars-segma
spec:
  type: ClusterIP   # internal only - never expose outside the cluster
  selector:
    app.kubernetes.io/name: nars-segma
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
