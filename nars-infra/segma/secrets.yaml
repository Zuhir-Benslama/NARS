---
# ─── nars-segma-secrets Reference Template ────────────────────────────────────
# 🚨 This file is for documentation only. It has NO stringData — it exists
# purely to show which keys `make secrets-apply` creates in the
# nars-segma-secrets Secret (see make/deploy.mk, secrets-apply).
#
# The segma Deployment (segma/deployment.yaml) consumes these keys via
# secretKeyRef, so a bare `kubectl apply -k k8s/` applied WITHOUT first running
# `make secrets-apply` leaves the pod failing its env resolution until the
# Secret exists — same contract as the nars-secrets reference (k8s/secret.yaml).
#
# Expected keys created by `make secrets-apply`:
#   internal-token     — NARS_SEGMA_INTERNAL_TOKEN, shared with nars-api
#                        (which holds it as Segmentation__InternalToken)
#   weights-url        — NARS_SEGMA_WEIGHTS_URL, the buildings checkpoint URL
#                        fetched by the fetch-weights initContainer
#   road-weights-url   — NARS_SEGMA_ROAD_WEIGHTS_URL, the raw roads checkpoint
#                        URL fetched by fetch-road-weights and converted by
#                        convert-roads-weights
#
apiVersion: v1
kind: Secret
metadata:
  name: nars-segma-secrets
  namespace: nars
  annotations:
    kubernetes.io/description: "Reference only — use `make secrets-apply` to generate"
type: Opaque
