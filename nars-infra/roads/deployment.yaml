---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nars-roads
  labels:
    app.kubernetes.io/name: nars-roads
    app.kubernetes.io/component: segmentation
    app.kubernetes.io/version: "latest"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nars-roads
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nars-roads
        app.kubernetes.io/component: segmentation
    spec:
      # No cluster API access is needed — do not mount the default SA token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Must match USER in docker/Dockerfile.nars-roads (10001)
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: nars-roads
          # ⚠ Dev default only — override via kustomize in CI/CD (e.g.
          # kustomize edit set image zuhirbenslama/nars-roads=ghcr.io/org/nars-roads:<sha>).
          image: zuhirbenslama/nars-roads:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: NARS_ROADS_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nars-roads-secrets
                  key: internal-token
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability:4317"
            - name: OTEL_SERVICE_NAME
              value: "nars-roads"
            - name: TMPDIR
              value: /tmp
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: temp
          emptyDir: {}
