---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nars-roads
  # Explicit so standalone `kubectl apply -f nars-infra/roads/` also lands in
  # nars (matches the parent kustomization, which applies the same namespace).
  namespace: nars
  labels:
    app.kubernetes.io/name: nars-roads
    app.kubernetes.io/component: segmentation
    app.kubernetes.io/version: "latest"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nars-roads
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nars-roads
        app.kubernetes.io/component: segmentation
    spec:
      # No cluster API access is needed — do not mount the default SA token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Must match USER in docker/Dockerfile.nars-roads (10001)
        runAsUser: 10001
        fsGroup: 10001
      initContainers:
        - name: fetch-weights
          # Pulls the model checkpoint from NARS_ROADS_WEIGHTS_URL into a
          # shared emptyDir. Fails the init (CrashLoopBackOff) instead of
          # letting the pod sit NotReady forever when weights can't be fetched,
          # so the cause is visible in `kubectl describe pod`.
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              if [ -z "$NARS_ROADS_WEIGHTS_URL" ]; then
                echo "NARS_ROADS_WEIGHTS_URL is not set; cannot fetch weights" >&2
                exit 1
              fi
              curl --fail --silent --show-error --location \
                "$NARS_ROADS_WEIGHTS_URL" -o /srv/weights/unet_bldg_base.pth
              ls -lh /srv/weights
          env:
            - name: NARS_ROADS_WEIGHTS_URL
              valueFrom:
                secretKeyRef:
                  name: nars-roads-secrets
                  key: weights-url
                  optional: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: weights
              mountPath: /srv/weights
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      containers:
        - name: nars-roads
          # ⚠ Dev default only — override via kustomize in CI/CD (e.g.
          # kustomize edit set image zuhirbenslama/nars-roads=ghcr.io/org/nars-roads:<sha>).
          image: zuhirbenslama/nars-roads:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: NARS_ROADS_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nars-roads-secrets
                  key: internal-token
            - name: NARS_ROADS_WEIGHTS_PATH
              value: /srv/weights/unet_bldg_base.pth
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability:4317"
            - name: OTEL_SERVICE_NAME
              value: "nars-roads"
            - name: TMPDIR
              value: /tmp
            # readOnlyRootFilesystem makes the image's /home/nars-roads (and any
            # ~/.cache) read-only. Point HOME at the writable emptyDir so tools
            # that write user caches (e.g. torch, GDAL) don't fail at runtime.
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temp
              mountPath: /tmp
            - name: weights
              mountPath: /srv/weights
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: temp
          emptyDir: {}
        - name: weights
          emptyDir: {}
