---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nars-roads
  labels:
    app.kubernetes.io/name: nars-roads
    app.kubernetes.io/component: segmentation
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nars-roads
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nars-roads
        app.kubernetes.io/component: segmentation
    spec:
      containers:
        - name: nars-roads
          image: zuhirbenslama/nars-roads:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: NARS_ROADS_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nars-roads-secrets
                  key: internal-token
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability:4317"
            - name: OTEL_SERVICE_NAME
              value: "nars-roads"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
