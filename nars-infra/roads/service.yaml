---
apiVersion: v1
kind: Service
metadata:
  name: nars-roads
  # Explicit so standalone `kubectl apply -f nars-infra/roads/` also lands in
  # nars (matches the parent kustomization, which applies the same namespace).
  namespace: nars
  labels:
    app.kubernetes.io/name: nars-roads
spec:
  type: ClusterIP   # internal only - never expose outside the cluster
  selector:
    app.kubernetes.io/name: nars-roads
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
