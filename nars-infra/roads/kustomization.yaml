---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Explicit so standalone `kubectl apply -k nars-infra/roads/` also lands in the
# nars namespace, matching the parent overlay (k8s/kustomization.yaml sets the
# same namespace). The resources below also hardcode namespace: nars as a belt-
# and-suspenders guard against building this tree in isolation.
namespace: nars
resources:
  - deployment.yaml
  - service.yaml
