---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Production overlay — hardens the base (nars-infra/k8s) for a real cluster.
# Lives OUTSIDE k8s/ so it is not part of the base build context (a base
# cannot contain its own overlays — kustomize rejects that cycle).
#
# Dev-only local ingresses are already excluded because the base does not
# include ingress-local.yaml (that file is added only by the dev overlay),
# so no delete patches are needed here.
#
#   kubectl kustomize nars-infra/overlays/production | kubectl apply -f -
#   make kustomize-apply IMAGE_TAG=<commit-sha> DEPLOY_ENV=production
#
# ⚠ Before applying, replace the REPLACE_ME_* placeholders in:
#   patches/health-ingress.yaml  (cluster pod/service CIDRs for /health)
#   patches/storage-postgis-pvc.yaml  (durable storage class for the database PVC)
#   patches/storage-backup-pvc.yaml   (durable storage class for the backup PVC)
# The deploy path fails closed while any REPLACE_ME remains (secrets-validate).
# patches/remove-kind-pv.yaml needs no editing — it just strips the kind-only
# hostPath PV that the base PVC would otherwise statically bind to.
resources:
  - ../../k8s
patches:
  - path: patches/configmap.yaml
  - path: patches/health-ingress.yaml
  - path: patches/storage-postgis-pvc.yaml
    target:
      kind: PersistentVolumeClaim
      name: postgis-pvc
  - path: patches/storage-backup-pvc.yaml
    target:
      kind: PersistentVolumeClaim
      name: postgis-backup-pvc
  - path: patches/remove-kind-pv.yaml
