CONFIG
  ENV
    # Debian's cgi-mapserver REQUIRES MS_MAP_PATTERN to be defined in the
    # global config file before any request (map= or MS_MAPFILE) is accepted.
    # nginx cannot pass this value as a fastcgi_param because a literal '$'
    # cannot be expressed in an nginx config value; here it lives in
    # MapServer's own parser, where the regex is authoritative.
    # Only our single mapfile may ever be loaded.
    MS_MAP_PATTERN "^/etc/mapserver/xyz\\.map$"
  END
END