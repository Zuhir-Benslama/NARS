# nars-tiles nginx server block (replaces the Debian default site).
# nginx serves the pre-built XYZ pyramid as immutable static files and proxies
# WMS to MapServer via a fcgiwrap socket. Both endpoints are consumed
# cross-origin by the SPA, so CORS headers reflect the request Origin.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /data;

    # ── Pre-built XYZ pyramid ──────────────────────────────────────────
    # gdal2tiles --xyz layout: /data/tiles/{z}/{x}/{y}.png. A missing tile is a
    # real 404 (MapLibre treats it as "no data here"); WMS is never consulted
    # for a tile that was pre-built. 404s deliberately carry no Cache-Control,
    # so a tile that appears in a later pyramid build is not poisoned for a
    # year by an immutable 404. MapLibre tile fetches are simple GETs (no
    # preflight), so no OPTIONS branch is needed here.
    location ^~ /tiles/ {
        try_files $uri =404;
        expires 1y;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Vary Origin always;
        access_log off;
    }

    # ── WMS (MapServer via fcgiwrap) ───────────────────────────────────
    # mode=tile REQUIRES the literal '+' separators in TILE={x}+{y}+{z};
    # %2B fails with "Invalid number of tile coordinates" because MapServer
    # plustospace()s the query string. nginx passes $query_string raw, so the
    # '+' survives intact.
    location = /wms {
        include fastcgi_params;
        # Serve exactly one mapfile, via MS_MAPFILE. MapServer would otherwise
        # honor a client-supplied map= parameter (path traversal into any
        # readable parseable file); refuse any override. FastCGI env vars like
        # MS_MAP_PATTERN can't be set here because nginx has no way to express
        # a literal '$' in a value — the guard is simpler and stricter anyway.
        if ($args ~* "(^|[&;])map=") {
            return 403;
        }
        fastcgi_param SCRIPT_FILENAME /usr/lib/cgi-bin/mapserv;
        fastcgi_param SCRIPT_NAME /wms;
        fastcgi_param MS_MAPFILE /etc/mapserver/xyz.map;
        fastcgi_pass unix:/run/fcgiwrap/mapserv.socket;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Vary Origin always;
        # WMS responses are rendered on demand — never cache them.
        add_header Cache-Control "no-store";
    }
}