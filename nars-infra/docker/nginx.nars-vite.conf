# Rate limiting zones — defined at http level (outside server) so zone state
# survives nginx reloads. A server-level definition reinitializes counters on
# every reload, letting an attacker reset rate limits via a configmap change.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:5m rate=3r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff2 application/wasm;
    gzip_min_length 256;
    gzip_comp_level 5;

    # CSP is built once at server level via nginx variables so every location
    # shares the same value (add_header does NOT inherit from parent blocks,
    # but variables DO). Build it with repeated `set` instead of backslash
    # continuation — nginx treats backslash + newline as literal characters in
    # quoted strings.
    #
    # style-src 'unsafe-inline' is required by Vue 3 <transition> which injects
    # inline styles via JS at runtime. This is safe because script-src does NOT
    # allow 'unsafe-inline', preventing CSS injection from escalating to XSS.
    # Nonces are not viable for static SPAs (require per-request HTML generation).
    set $csp "default-src 'self';";
    set $csp "${csp} script-src 'self' blob:;";
    set $csp "${csp} style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;";
    set $csp "${csp} font-src 'self' https://fonts.gstatic.com;";
    set $csp "${csp} img-src 'self' data: https: blob:;";
    set $csp "${csp} connect-src 'self' data: https://*.arcgisonline.com https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com;";
    set $csp "${csp} worker-src 'self' blob:;";
    set $csp "${csp} object-src 'none';";
    set $csp "${csp} base-uri 'self';";
    set $csp "${csp} form-action 'self';";
    set $csp "${csp} upgrade-insecure-requests";

    # SPA fallback — all routes serve index.html
    # HSTS is served by the ingress controller (see ingress-frontend.yaml annotations).
    # upgrade-insecure-requests ensures all embedded resources use HTTPS.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy $csp always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    }

    # OpenTelemetry trace proxy — sends browser traces to the OTel collector
    # inside the cluster. Same-origin path avoids CORS and mixed-content issues.
    # Uses a variable to defer DNS resolution so nginx starts even when the
    # OTel collector is not deployed (returns 502 instead of failing to start).
    # The resolver below makes the variable-resolved name re-resolvable.
    # Trailing dot makes the name an absolute FQDN, avoiding search-domain
    # expansion. 30s TTL balances freshness with overhead. The /api and /login
    # proxies use a static FQDN, so their DNS is resolved once at startup.
    resolver kube-dns.kube-system.svc.cluster.local. valid=30s;

    # API proxy — forwards /api/ calls to the backend service.
    # Same-origin proxying avoids CORS issues and browser mTLS complexity.
    location /api/ {
        # Match the backend's 50MB upload cap (DraftFeaturesController.SegmentTile).
        # Without this, nginx's 1MB default rejects tile uploads with 413 before
        # they reach nars-api.
        client_max_body_size 50m;
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://nars-api.nars.svc.cluster.local:8080;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    # Login page — served by the backend (injects CSRF token + CSP nonce).
    # NOT handled by the SPA fallback — an unauthenticated user hitting /login
    # must get the static HTML login page, not the SPA (which would trigger
    # an infinite auth-check → redirect loop).
    location /login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://nars-api.nars.svc.cluster.local:8080;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location /v1/traces {
        client_max_body_size 1m;
        set $otel_upstream http://otel-collector.observability.svc.cluster.local:4318;
        proxy_pass $otel_upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_intercept_errors on;
        error_page 502 =204 /_empty;
    }
    location = /_empty {
        return 204;
    }

    # Cache static assets aggressively.
    # CSP comes from the server-level $csp variable built above — no per-location
    # duplication needed (add_header does NOT inherit, variables DO).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    }
}
