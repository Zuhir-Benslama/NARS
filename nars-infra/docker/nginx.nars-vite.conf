server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # SPA fallback — all routes serve index.html
    # HSTS is served by the ingress controller (see ingress-frontend.yaml annotations).
    # upgrade-insecure-requests ensures all embedded resources use HTTPS.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy "\
            default-src 'self'; \
            script-src 'self' blob:; \
            style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
            font-src 'self' https://fonts.gstatic.com; \
            img-src 'self' data: https: blob:; \
            connect-src 'self' data: https://*.arcgisonline.com https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; \
            worker-src 'self' blob:; \
            upgrade-insecure-requests" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    }

    # OpenTelemetry trace proxy — sends browser traces to the OTel collector
    # inside the cluster. Same-origin path avoids CORS and mixed-content issues.
    # Uses a variable to defer DNS resolution so nginx starts even when the
    # OTel collector is not deployed (returns 502 instead of failing to start).
    # Cluster DNS resolver — trailing dot makes the name an absolute FQDN,
    # avoiding search-domain expansion for the OTel collector variable below.
    # Local resolver for the OTel variable (line 46). 30s TTL balances freshness
    # with overhead. The api proxy uses a static FQDN so DNS is resolved at startup.
    resolver kube-dns.kube-system.svc.cluster.local. valid=30s;

    # API proxy — forwards /api/ calls to the backend service.
    # Same-origin proxying avoids CORS issues and browser mTLS complexity.
    location /api/ {
        proxy_pass http://nars-api.nars.svc.cluster.local;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/traces {
        set $otel_upstream http://otel-collector.observability.svc.cluster.local:4318;
        proxy_pass $otel_upstream;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_intercept_errors on;
        error_page 502 =204 /_empty;
    }
    location = /_empty {
        return 204;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
