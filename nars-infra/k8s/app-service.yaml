---
apiVersion: v1
kind: Service
metadata:
  name: nars-api
  namespace: nars
  labels:
    app.kubernetes.io/name: nars-api
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nars-api
    app.kubernetes.io/component: api
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
