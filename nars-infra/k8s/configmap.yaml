---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nars-config
  namespace: nars
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  # Production CORS origins only.
  # Localhost entries are NOT included — they are set by the local dev env.
  Cors__AllowedOrigins__0: "https://nars.dz"
  Cors__AllowedOrigins__1: "https://api.nars.dz"
  # Restricted to known domains. The httpGet probes in app-deployment.yaml
  # set a Host header matching one of these values via httpHeaders.
  AllowedHosts: "nars.dz;api.nars.dz;localhost"
  # Shared between backup-cronjob and any other DB-consuming pods.
  PGHOST: "postgis"
  PGPORT: "5432"
  PGUSER: "postgres"
  PGDATABASE: "nars_db"
