---
grafana:
  # Password must be set at install time via --set
  # grafana.adminPassword=$GRAFANA_PASSWORD
  # Do NOT hardcode a password here. The Makefile handles this automatically.
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: false
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      # loki-gateway (auth proxy) rather than the direct loki service.
      # Kept in sync with the Makefile observability-loki target.
      url: http://loki-gateway:80
      access: proxy
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo:3200
      access: proxy
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
        lokiSearch:
          datasourceUid: loki
    - name: Prometheus
      type: prometheus
      uid: prometheus
      url: http://kube-prometheus-stack-prometheus:9090
      access: proxy

global:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

prometheus:
  prometheusSpec:
    retention: 15d
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector:
      matchLabels:
        release: prometheus-stack
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
      allowPrivilegeEscalation: false

alertmanager:
  # Disabled — no external notification channels configured.
  # Enable when email/Slack/PagerDuty routes are ready.
  enabled: false

defaultRules:
  create: true

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
