---
mode: deployment
# 2 replicas for production HA. During node maintenance, one replica can
# continue receiving telemetry while the other is rescheduled.
replicaCount: 2

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.120.0

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 512Mi

presets:
  kubernetesEvents:
    enabled: true

ports:
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
          cors:
            allowed_origins:
              # ⚠ Update these if the deployed domain or port changes.
              # Localhost entries should only be included via Helm overrides for dev:
              #   --set 'config.receivers.otlp.protocols.http.cors.allowed_origins[0]=http://localhost:5173'
              - http://nars.dz:8080
              - http://nars.dz:80
              - https://nars.dz:8443
              - https://nars.dz
              - https://api.nars.dz:8443
              - https://api.nars.dz

  processors:
    batch:
      timeout: 1s
      send_batch_size: 1024

  exporters:
    otlp:
      endpoint: tempo:4317
      # TLS is disabled by default for local dev. For production:
      #   1. Generate or obtain TLS certs for the tempo service
      #   2. Create a Secret with tls.crt, tls.key, and ca.crt:
      #        kubectl create secret generic otel-tempo-tls \
      #          --from-file=tls.crt=tempo.crt \
      #          --from-file=tls.key=tempo.key \
      #          --from-file=ca.crt=ca.crt \
      #          -n nars
      #   3. Set insecure: false and uncomment the tls block below
      #   4. Mount the secret via extraVolumes/extraVolumeMounts:
      #        extraVolumes:
      #          - name: otel-tls
      #            secret:
      #              secretName: otel-tempo-tls
      #        extraVolumeMounts:
      #          - name: otel-tls
      #            mountPath: /etc/otel/certs
      #            readOnly: true
      # tls:
      #   insecure: false
      #   cert_file: /etc/otel/certs/tls.crt
      #   key_file: /etc/otel/certs/tls.key
      #   ca_file: /etc/otel/certs/ca.crt
      # ⚠ SECURITY: insecure=true sends traces unencrypted to Tempo.
      # For production, generate certs and override via Helm:
      #   --set config.exporters.otlp.tls.insecure=false
      #   --set config.exporters.otlp.tls.cert_file=/etc/otel/certs/tls.crt
      #   --set config.exporters.otlp.tls.key_file=/etc/otel/certs/tls.key
      #   --set config.exporters.otlp.tls.ca_file=/etc/otel/certs/ca.crt
      # See commented tls block above for full volume mount instructions.
      tls:
        insecure: true
    loki:
      # ⚠ SECURITY: Loki auth should be enabled in production:
      #   --set loki.auth_enabled=true
      endpoint: http://loki-gateway:80/loki/api/v1/push
    prometheus:
      endpoint: 0.0.0.0:8889
      resource_to_telemetry_conversion:
        enabled: true
    # debug exporter with verbosity: critical only logs errors, not full
    # telemetry payloads. Safe for dev/staging. Remove from pipelines or
    # increase verbosity to 'normal' for production observability.
    debug:
      verbosity: critical

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp, debug]
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [prometheus, debug]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [loki, debug]
