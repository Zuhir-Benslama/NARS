---
mode: deployment
# Single replica is acceptable for dev. For production, increase to 2+ and add
# a PodDisruptionBudget to avoid telemetry gaps during node maintenance.
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.120.0

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 512Mi

presets:
  kubernetesEvents:
    enabled: true

ports:
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
          cors:
            allowed_origins:
              # ⚠ Update these if the deployed domain or port changes.
              # For dynamic environments, consider using a configurable variable.
              - http://localhost:5173
              - http://localhost:8080
              - http://localhost:80
              - http://nars.dz:8080
              - http://nars.dz:80
              - https://nars.dz:8443
              - https://api.nars.dz:8443

  processors:
    batch:
      timeout: 1s
      send_batch_size: 1024

  exporters:
    otlp:
      endpoint: tempo:4317
      # TLS is disabled by default for local dev. For production:
      #   1. Generate or obtain TLS certs for the tempo service
      #   2. Create a Secret with tls.crt, tls.key, and ca.crt:
      #        kubectl create secret generic otel-tempo-tls \
      #          --from-file=tls.crt=tempo.crt \
      #          --from-file=tls.key=tempo.key \
      #          --from-file=ca.crt=ca.crt \
      #          -n nars
      #   3. Set insecure: false and uncomment the tls block below
      #   4. Mount the secret via extraVolumes/extraVolumeMounts:
      #        extraVolumes:
      #          - name: otel-tls
      #            secret:
      #              secretName: otel-tempo-tls
      #        extraVolumeMounts:
      #          - name: otel-tls
      #            mountPath: /etc/otel/certs
      #            readOnly: true
      # tls:
      #   insecure: false
      #   cert_file: /etc/otel/certs/tls.crt
      #   key_file: /etc/otel/certs/tls.key
      #   ca_file: /etc/otel/certs/ca.crt
      # ⚠ SECURITY: insecure=true disables TLS for dev. For production,
      # generate certs and set insecure: false (see commented config above).
      tls:
        insecure: true
    loki:
      # ⚠ SECURITY: Loki auth should be enabled in production:
      #   --set loki.auth_enabled=true
      endpoint: http://loki-gateway:80/loki/api/v1/push
    prometheus:
      endpoint: 0.0.0.0:8889
      resource_to_telemetry_conversion:
        enabled: true
    # ⚠ SECURITY: debug exporter logs all trace/log/metric data to collector
    # stdout. Set verbosity to 'critical' (errors only) or remove entirely
    # from pipelines below for production deployments.
    debug:
      verbosity: critical

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp, debug]
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [prometheus, debug]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [loki, debug]
