---
# ─── Frontend Ingress ──────────────────────────────────────────────────
# Serves nars.dz (SPA + API) with TLS but NO mTLS (browser-facing).
# /api/* routes to the API service; /(.*) routes to the SPA.
# HSTS is served by the ingress controller via
# nginx.ingress.kubernetes.io/configuration-snippet or the global
# controller --enable-hsts flag. ssl-redirect ensures HTTP → HTTPS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nars-frontend
  namespace: nars
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nars.dz
      secretName: nars-tls
  rules:
    - host: nars.dz
      http:
        paths:
          - path: /health
            pathType: Exact
            backend:
              service:
                name: nars-api
                port:
                  number: 8080
          - path: /login
            pathType: Exact
            backend:
              service:
                name: nars-api
                port:
                  number: 8080
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: nars-api
                port:
                  number: 8080
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: nars-frontend
                port:
                  number: 8080
---
# ─── Frontend Ingress (local dev) ──────────────────────────────────────
# Serves localhost without TLS for local development access.
# No host restriction — catches any host (192.168.x.x, etc.) so
# LAN devices and ADB-reversed ports reach the SPA.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nars-frontend-local
  namespace: nars
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /health
            pathType: Exact
            backend:
              service:
                name: nars-api
                port:
                  number: 8080
          - path: /login
            pathType: Exact
            backend:
              service:
                name: nars-api
                port:
                  number: 8080
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: nars-api
                port:
                  number: 8080
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: nars-frontend
                port:
                  number: 8080
    - http:
        paths:
          - path: /health
            pathType: Exact
            backend:
              service:
                name: nars-api
                port:
                  number: 8080
          - path: /login
            pathType: Exact
            backend:
              service:
                name: nars-api
                port:
                  number: 8080
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: nars-api
                port:
                  number: 8080
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: nars-frontend
                port:
                  number: 8080
