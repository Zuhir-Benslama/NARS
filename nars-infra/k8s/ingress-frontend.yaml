---
# ─── Frontend Ingress ──────────────────────────────────────────────────
# Serves nars.dz (SPA + API) with TLS but NO mTLS (browser-facing).
# /api/* routes to the API service; /(.*) routes to the SPA.
# /health is deliberately NOT routed here — it would expose the API's
# health status publicly and defeat the CIDR-restricted dedicated
# nars-api-health ingress. External monitoring must use api.nars.dz/health.
# HSTS is served by the ingress controller via
# nginx.ingress.kubernetes.io/configuration-snippet or the global
# controller --enable-hsts flag. ssl-redirect ensures HTTP → HTTPS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nars-frontend
  namespace: nars
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # AI generation holds /api responses open for CPU-bound segma inference
    # (~100-130s for a commune z18 tile); the 60s default aborted generation.
    # Budget the full window (frontend/API totals are 240s).
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nars.dz
      secretName: nars-tls
  rules:
    - host: nars.dz
      http:
        paths:
          - path: /login
            pathType: Exact
            backend:
              service:
                name: nars-api
                port:
                  number: 8080
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: nars-api
                port:
                  number: 8080
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: nars-frontend
                port:
                  number: 80
