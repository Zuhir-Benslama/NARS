---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgis-pvc
  namespace: nars
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  volumeName: postgis-pv
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgis
  namespace: nars
  labels:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/component: database
    app.kubernetes.io/version: "latest"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgis
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgis
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: postgis
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      # PostGIS runs as uid 999 (postgres) via initContainer + entrypoint override.
      # The initContainer (root) chowns the data directory, then the main container
      # runs as the postgres user. This avoids running the database server as root.
      # See: https://github.com/docker-library/postgres/issues/672
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      initContainers:
        # Chown the data directory to the postgres uid (999) before the main
        # container starts. Must run as root to change ownership.
        - name: init-chown
          image: zuhirbenslama/nars-postgis:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ec
            - |
              chown -R 999:999 /var/lib/postgresql/data
              chmod 700 /var/lib/postgresql/data
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
              drop:
                - ALL
          volumeMounts:
            - name: postgis-data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgis
          image: zuhirbenslama/nars-postgis:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            # These are fixed values that don't change between environments.
            # Keeping them here (not in ConfigMap) is intentional — they are
            # intrinsic to the database image, not application config.
            - name: POSTGRES_DB
              value: nars_db
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nars-secrets
                  key: postgres_password
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - nars_db
                - -h
                - localhost
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - nars_db
                - -h
                - localhost
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - nars_db
                - -h
                - localhost
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          # The initContainer handles chown; the main container can now run as
          # the postgres user (uid 999). CHOWN/DAC_OVERRIDE/SETUID/SETGID/FOWNER
          # are only needed during init (handled above). allowPrivilegeEscalation
          # remains true because postgres's postmaster forks child processes.
          securityContext:
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: postgis-data
              mountPath: /var/lib/postgresql/data
            - name: postgis-run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: postgis-data
          persistentVolumeClaim:
            claimName: postgis-pvc
        - name: postgis-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgis
  namespace: nars
  labels:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/component: database
spec:
  selector:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/component: database
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
