---
# ─── API Ingress (secure) ──────────────────────────────────────────────
# Serves api.nars.dz with TLS + mTLS client certificate authentication.
# HTTP traffic is redirected to HTTPS; HTTPS requires a valid client cert
# signed by the nars-ca (see make ca-generate / ca-secret).
# NOTE: /health is deliberately NOT here — it has its own ingress below
# so monitoring systems can reach it without a client cert.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nars-api
  namespace: nars
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-secret: "nars/nars-ca"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.nars.dz
      secretName: nars-tls
  rules:
    - host: api.nars.dz
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: nars-api
                port:
                  number: 80
---
# ─── Health Check Ingress (no mTLS) ────────────────────────────────────
# Separate ingress for /health so external monitoring can reach it
# without requiring a client certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nars-api-health
  namespace: nars
  annotations:
    # No ssl-redirect — health checks must work over plain HTTP for monitoring
    # systems that don't support HTTPS. The /health endpoint exposes no
    # sensitive data.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.nars.dz
      secretName: nars-tls
  rules:
    - host: api.nars.dz
      http:
        paths:
          - path: /health
            pathType: Exact
            backend:
              service:
                name: nars-api
                port:
                  number: 80
---
# ─── API Ingress (local dev) ──────────────────────────────────────────
# Serves localhost without TLS/mTLS for local development access.
# Port-forward ingress-nginx to localhost, then:
#   curl http://localhost:8080/api/feature-types
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nars-api-local
  namespace: nars
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: nars-api
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: nars-api
                port:
                  number: 80
