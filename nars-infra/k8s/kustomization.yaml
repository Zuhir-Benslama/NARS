---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nars
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/part-of: nars
      app.kubernetes.io/managed-by: kustomize
resources:
  - namespace.yaml
  - configmap.yaml
  - service-account.yaml
  - postgis-pv.yaml
  - postgis.yaml
  - app-deployment.yaml
  - app-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress-api.yaml
  - ingress-frontend.yaml
  # nars-api-local and nars-frontend-local live in ingress-local.yaml but are
  # NOT listed here — they are dev-only and added by the development overlay
  # (nars-infra/overlays/dev). Keeping them out of the base keeps the base
  # safe to deploy to any environment.
  - network-policy.yaml
  - resource-quota.yaml
  - hpa.yaml
  - pdb.yaml
  - backup-cronjob.yaml
  # nars-roads segmentation microservice (deployment.yaml + service.yaml)
  - ../roads
  # otel-metrics-service.yaml and servicemonitor.yaml are applied separately
  # after the observability stack is installed (their CRDs are only available then):
  #   make observability-servicemonitor
# ─── Environment Overlays ──────────────────────────────────────────────
# Overlays live OUTSIDE this directory (nars-infra/overlays/) because a
# kustomize base cannot contain its own overlays (it rejects the cycle).
#
#   nars-infra/overlays/
#   ├── dev/          # base + local dev ingresses (nars-infra/k8s/ingress-local/)
#   │   └── kustomization.yaml   # resources: [../../k8s, ../../k8s/ingress-local]
#   └── production/   # base + Production env + production health CIDRs
#       ├── kustomization.yaml   # resources: [../../k8s]
#       └── patches/
#           ├── configmap.yaml        # ASPNETCORE_ENVIRONMENT=Production
#           └── health-ingress.yaml   # ⚠ replace REPLACE_ME_* CIDRs
#
# The Makefile selects the overlay from $(DEPLOY_ENV) for `make kustomize-apply`
# (default/dev -> dev overlay; production -> production overlay).
#
# Apply manually with:
#   kubectl kustomize nars-infra/overlays/production | kubectl apply -f -
images:
  # ⚠ `latest` tags are for local dev only — they produce non-reproducible
  # deployments. CI/CD pipelines MUST override with a pinned SHA:
  #
  #   make kustomize-apply IMAGE_TAG=<commit-sha> DEPLOY_ENV=production
  #
  # Enforced: `make kustomize-apply` refuses IMAGE_TAG=latest when
  # DEPLOY_ENV != dev (see the _check-pinned-tag Makefile guard).
  #
  # 'make kustomize-apply' rewrites the four image tags at build time, so the
  # values here are just the default (this file is never mutated). To persist
  # a pin in this file manually, use:
  #   make kustomize-set-image-tag IMAGE_TAG=<commit-sha>
  #   (requires the standalone 'kustomize' binary)
  #
  # The same apply-time rewrite also pins the app.kubernetes.io/version label
  # on Deployments, so pod metadata always advertises the image tag actually
  # running (Services/PVCs carry no version label — they run no image).
  #
  # For production, use a specific commit SHA. Example:
  #   make kustomize-apply IMAGE_TAG=abc1234 DEPLOY_ENV=production
  #
  # imagePullPolicy is set to IfNotPresent directly in each Deployment YAML
  # because the bundled kustomize (v5.5.0 in kubectl 1.32) does not support
  # the newPullPolicy field.
  - name: zuhirbenslama/nars-api
    newTag: latest
  - name: zuhirbenslama/nars-postgis
    newTag: latest
  - name: zuhirbenslama/nars-vite
    newTag: latest
  - name: zuhirbenslama/nars-backup
    newTag: latest
  - name: zuhirbenslama/nars-roads
    newTag: latest
