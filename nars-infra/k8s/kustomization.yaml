---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nars
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: nars
      app.kubernetes.io/managed-by: kustomize
resources:
  - namespace.yaml
  - configmap.yaml
  - postgis-pv.yaml
  - postgis.yaml
  - app-deployment.yaml
  - app-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress-api.yaml
  - ingress-frontend.yaml
  # nars-api-local and nars-frontend-local are created by
  # the same files (multi-doc YAML)
  - service-account.yaml
  - network-policy.yaml
  - resource-quota.yaml
  - hpa.yaml
  - pdb.yaml
  - backup-cronjob.yaml
  # otel-metrics-service.yaml and servicemonitor.yaml are applied separately
  # after the observability stack is installed (their CRDs are only available then):
  #   make observability-servicemonitor
images:
  # ⚠ `latest` tags are for local dev only — they produce non-reproducible
  # deployments. CI/CD pipelines MUST override newTag with a pinned SHA:
  #
  #   make kustomize-apply IMAGE_TAG=<commit-sha>
  #
  # Or via kustomize directly:
  #   kustomize edit set image \
  #     zuhirbenslama/nars-api=zuhirbenslama/nars-api:<commit-sha>
  #
  # For production, use a specific commit SHA. Example:
  #   make kustomize-apply IMAGE_TAG=abc1234
  #
  # imagePullPolicy is set to IfNotPresent directly in each Deployment YAML
  # because the bundled kustomize (v5.5.0 in kubectl 1.32) does not support
  # the newPullPolicy field.
  - name: zuhirbenslama/nars-api
    newTag: latest
  - name: zuhirbenslama/nars-postgis
    newTag: latest
  - name: zuhirbenslama/nars-vite
    newTag: latest
