---
apiVersion: v1
kind: Namespace
metadata:
  name: nars
  labels:
    # Pod Security Admission: baseline prevents privileged/host access
    # but allows allowPrivilegeEscalation (required by PostGIS init).
    # nars-api and nars-frontend could pass restricted but PostGIS cannot.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    # To monitor PSA audit events, query:
    #   kubectl get --raw /apis/audit.k8s.io/v1/events \
    #     | jq '.items[] | select(.source.component == "pod-security-admission")'
    # Or integrate with kube-audit + Loki to alert on violations.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
