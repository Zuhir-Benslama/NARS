---
apiVersion: v1
kind: Service
metadata:
  name: nars-frontend
  namespace: nars
  labels:
    app.kubernetes.io/name: nars-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/version: "latest"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nars-frontend
    app.kubernetes.io/component: frontend
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
