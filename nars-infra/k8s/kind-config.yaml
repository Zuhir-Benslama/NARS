---
# Reference config — Makefile generates the actual config dynamically
# using the POSTGRES_DATA_DIR variable. See `make cluster-create`.
#
# ⚠ DO NOT apply this file directly. The hostPath below is a placeholder.
# Use `make cluster-up` which generates the real config with your POSTGRES_DATA_DIR.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: nars
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      certSANs:
        - "localhost"
        - "127.0.0.1"
        # Default: patch via Makefile for real multi-node access.
        - "0.0.0.0"
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: REPLACE_WITH_POSTGRES_DATA_DIR
        containerPath: /mnt/nars/postgis
