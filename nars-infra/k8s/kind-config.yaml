---
# Reference config — Makefile generates the actual config dynamically
# using the POSTGRES_DATA_DIR variable. See `make cluster-create`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: nars
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      certSANs:
        - "localhost"
        - "127.0.0.1"
        - "0.0.0.0"
        # ⚠ Replace <YOUR_HOST_IP> with your actual host IP before using this
        # file directly. Alternatively, run `make cluster-create` which
        # generates this config dynamically from POSTGRES_DATA_DIR.
        - "<YOUR_HOST_IP>"
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /absolute/path/to/data/nars/postgis
        containerPath: /mnt/nars/postgis
