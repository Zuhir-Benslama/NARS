---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgis-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  # ⚠ hostPath is for local dev (kind/minikube) only. Must NOT be used in
  # production. Replace with a CSI-backed persistent volume
  # (e.g. EBS, GCE PD, Azure Disk, Longhorn, Rook/Ceph).
  # CI/CD pipelines should validate: if .spec.hostPath exists and a production
  # label/annotation is present, the apply should be rejected.
  hostPath:
    path: /mnt/nars/postgis/data
    type: DirectoryOrCreate
