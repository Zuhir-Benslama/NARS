---
# ─── API Ingress (local dev) ──────────────────────────────────────────
# Serves localhost without TLS/mTLS for local development access.
# Port-forward ingress-nginx to localhost, then:
#   curl http://localhost:8080/api/feature-types
# Also serves /login (server-rendered login page) and /health.
#
# ⚠ DEV ONLY — this file is NOT part of the base kustomization. It is
# included by the development overlay (nars-infra/overlays/dev). Deploying
# these to a production cluster is blocked by the Makefile guard
# _check-local-ingresses and would expose /api and /login with no mTLS and
# a hostless catch-all.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nars-api-local
  namespace: nars
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /login
            pathType: Exact
            backend:
              service:
                name: nars-api
                port:
                  number: 8080
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: nars-api
                port:
                  number: 8080
          - path: /health
            pathType: Exact
            backend:
              service:
                name: nars-api
                port:
                  number: 8080
---
# ─── Frontend Ingress (local dev) ──────────────────────────────────────
# Serves localhost without TLS for local development access.
# No host restriction — catches any host (192.168.x.x, etc.) so
# LAN devices and ADB-reversed ports reach the SPA.
# Only this ingress owns the SPA catch-all (/.*). For the explicit
# `localhost` host it also routes /login and /api to the API service.
# Hostless /api, /login and /health requests are served by nars-api-local
# (the single source of truth for API routing) — /health is not routed
# here, which `make smoke-test` relies on.
#
# ⚠ DEV ONLY — see above. Not in the base kustomization.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nars-frontend-local
  namespace: nars
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /login
            pathType: Exact
            backend:
              service:
                name: nars-api
                port:
                  number: 8080
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: nars-api
                port:
                  number: 8080
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: nars-frontend
                port:
                  number: 80
    - http:
        paths:
          - path: /(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: nars-frontend
                port:
                  number: 80
