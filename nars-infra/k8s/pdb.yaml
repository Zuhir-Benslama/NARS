---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nars-api
  namespace: nars
  labels:
    app.kubernetes.io/name: nars-api
    app.kubernetes.io/component: api
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nars-api
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nars-frontend
  namespace: nars
  labels:
    app.kubernetes.io/name: nars-frontend
    app.kubernetes.io/component: frontend
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nars-frontend
      app.kubernetes.io/component: frontend
---
# PostGIS runs with 1 replica. A PDB with minAvailable: 1 would block
# voluntary disruption (node drain, cluster upgrade). Use maxUnavailable: 0
# for the same protection but clearer intent. Scale up before draining.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgis
  namespace: nars
  labels:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/component: database
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: postgis
      app.kubernetes.io/component: database
---
# nars-roads runs 1 replica. Same protection as PostGIS — scale up before draining.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nars-roads
  namespace: nars
  labels:
    app.kubernetes.io/name: nars-roads
    app.kubernetes.io/component: segmentation
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nars-roads
      app.kubernetes.io/component: segmentation
---
# otel-collector PDB lives in the observability namespace, managed separately.
# Do not include it here — applying via nars kustomization would create an
# orphan resource or fail if the namespace does not exist.
