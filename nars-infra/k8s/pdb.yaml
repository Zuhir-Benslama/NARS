---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nars-api
  namespace: nars
  labels:
    app.kubernetes.io/name: nars-api
    app.kubernetes.io/component: api
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nars-api
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nars-frontend
  namespace: nars
  labels:
    app.kubernetes.io/name: nars-frontend
    app.kubernetes.io/component: frontend
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nars-frontend
      app.kubernetes.io/component: frontend
---
# PostGIS runs with 1 replica. A PDB with minAvailable: 1 would block
# voluntary disruption (node drain, cluster upgrade). Use maxUnavailable: 0
# for the same protection but clearer intent. Scale up before draining.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgis
  namespace: nars
  labels:
    app.kubernetes.io/name: postgis
    app.kubernetes.io/component: database
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: postgis
      app.kubernetes.io/component: database
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otel-collector
  namespace: nars
  labels:
    app.kubernetes.io/name: opentelemetry-collector
    app.kubernetes.io/component: observability
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
