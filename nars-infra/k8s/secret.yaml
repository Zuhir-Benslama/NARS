---
# ─── Secret Reference Template ────────────────────────────────────────────────
# 🚨 DO NOT apply this file directly. These are placeholder values
# for reference.
# The Makefile generates real secrets at deploy time:
#   make secrets-apply       ← creates nars-secrets from env/random values
#   make ca-secret           ← creates nars-ca from nars-infra/k8s/certs/ca.crt
#   make tls-generate        ← creates nars-tls from mkcert
#
apiVersion: v1
kind: Secret
metadata:
  name: nars-secrets
  namespace: nars
  annotations:
    kubernetes.io/description: "Reference only — use `make secrets-apply` to generate"
type: Opaque
stringData:
  # ── PostGIS ─────────────────────────────────────────────────────────────
  postgres_password: "REPLACE_ME_postgis_password"
  # ── ASP.NET Connection Strings ───────────────────────────────────────────
  # yamllint disable-next-line rule:line-length
  ConnectionStrings__DefaultConnection: "Host=postgis;Port=5432;Database=nars_db;Username=postgres;Password=REPLACE_ME_postgis_password"
  # ── JWT ──────────────────────────────────────────────────────────────────
  # yamllint disable-next-line rule:line-length
  Jwt__SecretKey: "REPLACE_ME_jwt_secret_at_least_32_characters_long_for_hmac_sha256"
  # ── Backup Encryption ─────────────────────────────────────────────────────
  # Used by backup-cronjob for GPG symmetric encryption of pg_dump output.
  # If omitted, backups fall back to plaintext with a warning.
  gpg-passphrase: "REPLACE_ME_gpg_secret_passphrase"
