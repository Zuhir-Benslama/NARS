---
# ─── Secret Reference Template ────────────────────────────────────────────────
# 🚨 This file is for documentation only. It has NO stringData — it exists
# purely to show which keys `make secrets-apply` creates.
#
# The Makefile generates real secrets at deploy time:
#   make secrets-apply       ← creates nars-secrets from .env (auto-generated)
#   make ca-secret           ← creates nars-ca from nars-infra/k8s/certs/ca.crt
#   make tls-generate        ← creates nars-tls from mkcert
#
# Expected keys created by `make secrets-apply`:
#   postgres_password                       — PostGIS superuser password
#   ConnectionStrings__DefaultConnection     — EF Core connection string
#   Jwt__SecretKey                           — HMAC-SHA256 signing key (>=32 chars)
#   gpg-passphrase                           — GPG symmetric passphrase for backups
#   AdminSignup__SignupToken                 — required to bootstrap the first admin
#                                              (Program.cs refuses to start without it)
#   Segmentation__InternalToken              — shared secret for the nars-roads
#                                              microservice (also written to the
#                                              nars-roads-secrets secret as
#                                              `internal-token` / NARS_ROADS_INTERNAL_TOKEN)
#
apiVersion: v1
kind: Secret
metadata:
  name: nars-secrets
  namespace: nars
  annotations:
    kubernetes.io/description: "Reference only — use `make secrets-apply` to generate"
type: Opaque
