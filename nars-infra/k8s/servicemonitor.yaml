---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: observability
  labels:
    # Required by kube-prometheus-stack serviceMonitorSelector (release: prometheus-stack)
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
      app.kubernetes.io/instance: otel-collector
      app.kubernetes.io/component: metrics
  namespaceSelector:
    matchNames:
      - observability
  endpoints:
    - port: prometheus-exporter
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
