---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nars-api
  namespace: nars
  labels:
    app.kubernetes.io/name: nars-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nars-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nars-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: nars-api
      imagePullSecrets:
        - name: regcred
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - nars-api
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: nars-api
          # Dev default — override the tag via kustomize in CI/CD (e.g.
          # with --edit-image or a patch). The :latest + Always combo
          # ensures dev clusters always pull fresh.
          image: zuhirbenslama/nars-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: nars-config
            - secretRef:
                name: nars-secrets
          env:
            # Containers don't need runtime config file watching; disabling it
            # avoids inotify exhaustion on constrained local clusters.
            - name: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
              value: "false"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temp
              mountPath: /tmp
      volumes:
        - name: temp
          emptyDir: {}
