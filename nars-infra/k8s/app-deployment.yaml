---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nars-api
  namespace: nars
  labels:
    app.kubernetes.io/name: nars-api
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "latest"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nars-api
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nars-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: nars-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nars-api
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - nars-api
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        # Must match USER in docker/Dockerfile.nars-api (1654)
        runAsUser: 1654
        fsGroup: 1654
      containers:
        - name: nars-api
          # ⚠ Dev default only — override via kustomize in CI/CD (e.g.
          # kustomize edit set image zuhirbenslama/nars-api=ghcr.io/org/nars-api:<sha>).
          image: zuhirbenslama/nars-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: nars-config
          env:
            # Least-privilege: pull only the keys nars-api actually reads, not the
            # whole nars-secrets secret (which also carries postgres_password and
            # gpg-passphrase — the DB password is already embedded in the
            # connection string, but the backup GPG passphrase is unrelated to
            # the API and must not be exposed to its environment).
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: nars-secrets
                  key: ConnectionStrings__DefaultConnection
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: nars-secrets
                  key: Jwt__SecretKey
            - name: AdminSignup__SignupToken
              valueFrom:
                secretKeyRef:
                  name: nars-secrets
                  key: AdminSignup__SignupToken
            - name: Segmentation__InternalToken
              valueFrom:
                secretKeyRef:
                  name: nars-secrets
                  key: Segmentation__InternalToken
            # Containers don't need runtime config file watching; disabling it
            # avoids inotify exhaustion on constrained local clusters.
            - name: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
              value: "false"
          startupProbe:
            httpGet:
              path: /health/ready
              port: 8080
              httpHeaders:
                - name: Host
                  value: nars.dz
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            # DB-aware: pod leaves the Service endpoints while the database is
            # unreachable, so traffic stops instead of erroring.
            httpGet:
              path: /health/ready
              port: 8080
              httpHeaders:
                - name: Host
                  value: nars.dz
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            # Dependency-free on purpose: a database outage must not restart
            # otherwise-healthy pods (readiness handles traffic shedding).
            httpGet:
              path: /health/live
              port: 8080
              httpHeaders:
                - name: Host
                  value: nars.dz
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temp
              mountPath: /tmp
      volumes:
        - name: temp
          emptyDir: {}
