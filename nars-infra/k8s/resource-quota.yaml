---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: nars-quota
  namespace: nars
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: 5
    services: 15
    pods: 20
    jobs: 5
    cronjobs: 5
---
apiVersion: v1
kind: LimitRange
metadata:
  name: nars-limits
  namespace: nars
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 2
        memory: 2Gi
      type: Container
