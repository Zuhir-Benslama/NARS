---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: nars-quota
  namespace: nars
spec:
  hard:
    # Sized for the planned production host (96-core / 256GB) with 4 segma
    # replicas at 8 CPU / 12Gi each. A quota is a ceiling, not a reservation, so
    # these values do not constrain the 16-CPU dev kind node, which only ever
    # runs one segma replica.
    requests.cpu: "12"
    requests.memory: 24Gi
    limits.cpu: "48"
    limits.memory: 64Gi
    persistentvolumeclaims: 5
    services: 15
    pods: 20
    # Kubernetes has no bare 'jobs'/'cronjobs' quota resource — count-based
    # quota uses the fully-qualified 'count/<resource>.<group>' syntax.
    count/jobs.batch: 5
    count/cronjobs.batch: 5
---
apiVersion: v1
kind: LimitRange
metadata:
  name: nars-limits
  namespace: nars
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        # Must be >= the largest container limit or the offending pod is
        # rejected at admission with "maximum cpu usage per Container is 2, but
        # limit is 8". nars-segma is that largest container: 8 CPU / 12Gi.
        cpu: 8
        memory: 12Gi
      type: Container
