---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: nars-quota
  namespace: nars
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: 5
    services: 15
    pods: 20
    # Kubernetes has no bare 'jobs'/'cronjobs' quota resource — count-based
    # quota uses the fully-qualified 'count/<resource>.<group>' syntax.
    count/jobs.batch: 5
    count/cronjobs.batch: 5
---
apiVersion: v1
kind: LimitRange
metadata:
  name: nars-limits
  namespace: nars
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 2
        # nars-roads (PyTorch inference) requests 1Gi and is capped at 4Gi —
        # the LimitRange max must not reject its limit or the roads pods
        # fail admission control. Keep this ≥ the largest container limit.
        memory: 4Gi
      type: Container
