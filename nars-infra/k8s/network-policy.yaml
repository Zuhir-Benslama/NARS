---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: nars
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: nars
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: nars
spec:
  podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
  policyTypes:
    - Egress
---
# Allow nars-api to reach postgis (5432)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-api-to-postgis
  namespace: nars
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nars-api
      app.kubernetes.io/component: api
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgis
              app.kubernetes.io/component: database
      ports:
        - port: 5432
          protocol: TCP
  policyTypes:
    - Egress
---
# Allow nars-frontend to reach nars-api (8080)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-frontend-to-api
  namespace: nars
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nars-frontend
      app.kubernetes.io/component: frontend
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nars-api
              app.kubernetes.io/component: api
      ports:
        - port: 8080
          protocol: TCP
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-from-frontend-and-ingress
  namespace: nars
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nars-api
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nars-frontend
              app.kubernetes.io/component: frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              # ⚠ Verify these labels match your actual ingress controller.
              # The standard ingress-nginx deployment uses:
              #   app.kubernetes.io/component: controller
              #   app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/name: ingress-nginx
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgis-from-api
  namespace: nars
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgis
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nars-api
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgis-backup
              app.kubernetes.io/component: backup
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-otel
  namespace: nars
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - nars-frontend
          - nars-api
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-from-ingress
  namespace: nars
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nars-frontend
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              # ⚠ Verify these labels match your actual ingress controller.
              # The standard ingress-nginx deployment uses:
              #   app.kubernetes.io/component: controller
              #   app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/name: ingress-nginx
      ports:
        - port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backup-egress-to-postgis
  namespace: nars
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgis-backup
      app.kubernetes.io/component: backup
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgis
              app.kubernetes.io/component: database
      ports:
        - port: 5432
          protocol: TCP
  policyTypes:
    - Egress
