---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: nars
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: nars
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
  namespace: nars
spec:
  podSelector: {}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
  policyTypes:
    - Egress
---
# Allow nars-api to reach postgis (5432)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-api-to-postgis
  namespace: nars
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nars-api
      app.kubernetes.io/component: api
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgis
              app.kubernetes.io/component: database
      ports:
        - port: 5432
          protocol: TCP
  policyTypes:
    - Egress
---
# Allow nars-frontend to reach nars-api (8080)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-frontend-to-api
  namespace: nars
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nars-frontend
      app.kubernetes.io/component: frontend
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nars-api
              app.kubernetes.io/component: api
      ports:
        - port: 8080
          protocol: TCP
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-from-frontend-and-ingress
  namespace: nars
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nars-api
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nars-frontend
              app.kubernetes.io/component: frontend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgis-from-api
  namespace: nars
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgis
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nars-api
              app.kubernetes.io/component: api
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-otel-api
  namespace: nars
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nars-api
      app.kubernetes.io/component: api
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
  policyTypes:
    - Egress
---
# Allow nars-api to reach the nars-roads segmentation service (8000)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-api-to-roads
  namespace: nars
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nars-api
      app.kubernetes.io/component: api
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nars-roads
              app.kubernetes.io/component: segmentation
      ports:
        - port: 8000
          protocol: TCP
  policyTypes:
    - Egress
---
# Allow nars-roads to reach the OTel collector (4317/4318)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-otel-roads
  namespace: nars
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nars-roads
      app.kubernetes.io/component: segmentation
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
  policyTypes:
    - Egress
---
# Allow nars-api to reach nars-roads (8000) — ingress side
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-roads-from-api
  namespace: nars
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nars-roads
      app.kubernetes.io/component: segmentation
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nars-api
              app.kubernetes.io/component: api
      ports:
        - port: 8000
---
# The frontend only ships browser traces over HTTP (nginx /v1/traces proxy),
# so it gets 4318 only — not the OTLP gRPC port 4317.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-otel-frontend
  namespace: nars
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nars-frontend
      app.kubernetes.io/component: frontend
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 4318
          protocol: TCP
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-from-ingress
  namespace: nars
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nars-frontend
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
              app.kubernetes.io/component: controller
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backup-egress-to-postgis
  namespace: nars
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgis-backup
      app.kubernetes.io/component: backup
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgis
              app.kubernetes.io/component: database
      ports:
        - port: 5432
          protocol: TCP
  policyTypes:
    - Egress
---
# Allow backup CronJob to reach PostGIS (complements the egress rule above)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgis-from-backup
  namespace: nars
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgis
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgis-backup
              app.kubernetes.io/component: backup
      ports:
        - port: 5432
---
# Allow Prometheus (monitoring namespace) to scrape metrics from nars-api (the
# only nars pod exposing an HTTP metrics/health endpoint on 8080)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-scrape-from-monitoring
  namespace: nars
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nars-api
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
        - port: 8888
          protocol: TCP
        - port: 8889
          protocol: TCP
