---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tiles-pv
  labels:
    app.kubernetes.io/name: nars-tiles
    app.kubernetes.io/component: tiles
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  # ⚠ hostPath is for local dev (kind/minikube) only. Must NOT be used in
  # production. Replace with a CSI-backed persistent volume
  # (e.g. EBS, GCE PD, Azure Disk, Longhorn, Rook/Ceph) — see
  # overlays/production/patches/storage-tiles-pvc.yaml.
  # Host path is /mnt/nars/tiles so a wipe of repo-local data never touches
  # the pyramid (pyramids are expensive to rebuild).
  hostPath:
    path: /mnt/nars/tiles
    type: DirectoryOrCreate
