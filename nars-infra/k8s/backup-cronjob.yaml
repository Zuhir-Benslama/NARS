---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgis-backup-pvc
  namespace: nars
  labels:
    app.kubernetes.io/name: postgis-backup
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - ReadWriteOnce
  # ⚠ local-path is the kind/local-dev default. Override for production
  # (e.g., ebs-gp3, managed-premium, etc.) via a kustomize patch or
  # by editing this value before applying.
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgis-backup
  namespace: nars
  labels:
    app.kubernetes.io/name: postgis-backup
    app.kubernetes.io/component: backup
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgis-backup
  namespace: nars
  labels:
    app.kubernetes.io/name: postgis-backup
    app.kubernetes.io/component: backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      # Single hard deadline for the whole Job (an attempt that hangs past
      # this dies; retries count against the same budget). The pod-level
      # activeDeadlineSeconds duplicate was removed — the Job deadline
      # already bounds each attempt.
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgis-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: postgis-backup
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
          containers:
            - name: pg-dump
              image: zuhirbenslama/nars-backup:latest
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                # Must write backup files to /backup; enforced ro would block pg_dump output.
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/bash
                - -ec
                - |
                  set -o pipefail

                  TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
                  FILE="/backup/nars_db_${TIMESTAMP}.sql"
                  echo "→ Backing up database 'nars_db' (encrypted)..."
                  # Wrap the pipeline so a hard failure (pg_dump/gzip/gpg error)
                  # exits here and removes the partial file, instead of being
                  # cut off by set -e with a half-written .gz.gpg left behind.
                  if ! pg_dump \
                    -h "${PGHOST}" -U "${PGUSER}" -d "${PGDATABASE}" \
                    --no-owner \
                    | gzip \
                    | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" \
                          --symmetric --cipher-algo AES256 \
                          -o "${FILE}.gz.gpg"; then
                    echo "✖ Backup pipeline failed — removing partial file"
                    rm -f "${FILE}.gz.gpg"
                    exit 1
                  fi
                  FILESIZE=$(stat -c%s "${FILE}.gz.gpg" 2>/dev/null || echo 0)
                  if [ "$FILESIZE" -lt 100 ]; then
                    echo "✖ Backup file is suspiciously small (${FILESIZE} bytes) — possible pg_dump failure"
                    rm -f "${FILE}.gz.gpg"
                    exit 1
                  fi
                  echo "✓ Backup saved: ${FILE}.gz.gpg ($(numfmt --to=iec "$FILESIZE"))"
                  ls -lh /backup/
                  echo "→ Cleaning backups older than 30 days..."
                  find /backup -name "nars_db_*.sql*" -mtime +30 -delete
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              env:
                # Alpine's postgres uid is 70, not 999 — with HOME unset gpg
                # tries to create '//.gnupg' and fails. Point it at the
                # world-writable tmpdir (same pattern as nars-roads).
                - name: HOME
                  value: /tmp
                - name: PGHOST
                  valueFrom:
                    configMapKeyRef:
                      name: nars-config
                      key: PGHOST
                - name: PGPORT
                  valueFrom:
                    configMapKeyRef:
                      name: nars-config
                      key: PGPORT
                - name: PGUSER
                  valueFrom:
                    configMapKeyRef:
                      name: nars-config
                      key: PGUSER
                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef:
                      name: nars-config
                      key: PGDATABASE
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nars-secrets
                      key: postgres_password
                - name: GPG_PASSPHRASE
                  valueFrom:
                    secretKeyRef:
                      name: nars-secrets
                      key: gpg-passphrase
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: postgis-backup-pvc
