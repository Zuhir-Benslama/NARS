---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgis-backup-pvc
  namespace: nars
  labels:
    app.kubernetes.io/name: postgis-backup
    app.kubernetes.io/component: backup
spec:
  accessModes:
    - ReadWriteOnce
  # ⚠ local-path is the kind/local-dev default. Override for production
  # (e.g., ebs-gp3, managed-premium, etc.) via a kustomize patch or
  # by editing this value before applying.
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgis-backup
  namespace: nars
  labels:
    app.kubernetes.io/name: postgis-backup
    app.kubernetes.io/component: backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgis-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
          activeDeadlineSeconds: 600
          containers:
            - name: pg-dump
              image: postgres:17-alpine@sha256:af194ccf3e2d7fe367012c7b88ce8b816c5c889b18a5b316799a1f0d7eac746a
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                # Must write backup files to /backup; enforced ro would block pg_dump output.
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/bash
                - -ec
                - |
                  TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
                  FILE="/backup/nars_db_${TIMESTAMP}.sql"
                  echo "→ Backing up database 'nars_db'..."
                  pg_dump \
                    -h "${PGHOST}" -U "${PGUSER}" -d "${PGDATABASE}" \
                    --no-owner | gzip > "$FILE.gz"
                  echo "✓ Backup saved: ${FILE}.gz"
                  ls -lh /backup/
                  echo "→ Cleaning backups older than 30 days..."
                  find /backup -name "nars_db_*.sql*" -mtime +30 -delete
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              env:
                - name: PGHOST
                  valueFrom:
                    configMapKeyRef:
                      name: nars-config
                      key: PGHOST
                - name: PGPORT
                  valueFrom:
                    configMapKeyRef:
                      name: nars-config
                      key: PGPORT
                - name: PGUSER
                  valueFrom:
                    configMapKeyRef:
                      name: nars-config
                      key: PGUSER
                - name: PGDATABASE
                  valueFrom:
                    configMapKeyRef:
                      name: nars-config
                      key: PGDATABASE
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: nars-secrets
                      key: postgres_password
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: postgis-backup-pvc
