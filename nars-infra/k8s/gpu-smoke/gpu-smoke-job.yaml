---
apiVersion: batch/v1
kind: Job
metadata:
  name: nars-gpu-smoke
  namespace: nars
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 90
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nars-gpu-smoke
          image: zuhirbenslama/nars-segma:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - "import torch; print(\"cuda available:\", torch.cuda.is_available()); t = torch.zeros(2, device=\"cuda\") if torch.cuda.is_available() else None; print(\"zeros on cuda:\", t); print(\"device:\", torch.cuda.get_device_name(0) if torch.cuda.is_available() else \"n/a\")"
          resources:
            limits:
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault