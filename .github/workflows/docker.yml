---
name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag override (default: git SHA)"
        required: false

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOCKER_ORG: zuhirbenslama

jobs:
  changes:
    name: Path filters
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      images: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: none
          filters: |
            nars-api:
              - 'nars-api/**'
              - 'nars-infra/docker/Dockerfile.nars-api'
              - 'Directory.Build.props'
            nars-postgis:
              - 'nars-infra/scripts/**'
              - 'nars-infra/docker/Dockerfile.nars-postgis'
              - 'docs/seed_reference_data.sql'
            nars-vite:
              - 'nars-web/**'
              - 'nars-infra/docker/Dockerfile.nars-vite'
              - 'nars-infra/docker/nginx.nars-vite.conf'
              - 'nars-infra/docker/proxy-common-snippet.conf'
            nars-backup:
              - 'nars-infra/scripts/**'
              - 'nars-infra/docker/Dockerfile.nars-backup'
              - 'docs/seed_reference_data.sql'
            nars-segma:
              - 'nars-segma/**'
              - 'nars-infra/docker/Dockerfile.nars-segma'

  build-and-push:
    needs: changes

    name: "${{ matrix.image }}"
    # Pinned runner for the image-push path: reproducible base OS/toolchain
    # for Dockerfile builds. Bump deliberately when a newer LTS is needed.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # nars-docs-tex is deliberately absent: it is a compile-tool image that
        # make/docs.mk builds fresh with a pinned tag (docs-tex-image, :0.1.0)
        # and the docs-tex CI job rebuilds from source every run — no consumer
        # ever pulls a pushed copy, so publishing one would just drift.
        include:
          - image: nars-api
            context: "."
          - image: nars-postgis
            context: "."
          - image: nars-vite
            context: "."
          - image: nars-backup
            context: "."
          - image: nars-segma
            context: "nars-segma/"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_ORG }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      # Tag pushes (v*) are still `push` events, but a release must rebuild
      # every image for the `type=ref,event=tag` tag — running it through the
      # paths-filter risks computing an empty diff for the tag ref and pushing
      # zero release images. Bypass the filter for tags and dispatch.
      - name: Build and push
        if: github.event_name != 'push' || github.ref_type == 'tag' || contains(fromJSON(needs.changes.outputs.images), matrix.image)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: nars-infra/docker/Dockerfile.${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Summary
        run: |
          echo "### ${{ env.DOCKER_ORG }}/${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
