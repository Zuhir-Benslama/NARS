name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Workspace.sln

      - name: Build
        run: dotnet build Workspace.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Workspace.sln --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~Integration"

  frontend-lint:
    name: Frontend — Typecheck, Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nars-vite
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: nars-vite/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: zuhirbenslama/nars-api
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Docker/Dockerfile.nars-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate nars-vite metadata
        id: meta-vite
        uses: docker/metadata-action@v5
        with:
          images: zuhirbenslama/nars-vite
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push vite image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Docker/Dockerfile.nars-vite
          push: true
          tags: ${{ steps.meta-vite.outputs.tags }}
          labels: ${{ steps.meta-vite.outputs.labels }}

      - name: Generate nars-postgres metadata
        id: meta-postgres
        uses: docker/metadata-action@v5
        with:
          images: zuhirbenslama/nars-postgres
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push postgres image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Docker/Dockerfile.postgres
          push: true
          tags: ${{ steps.meta-postgres.outputs.tags }}
          labels: ${{ steps.meta-postgres.outputs.labels }}
