name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # ─── .NET (nars-api + nars-tests) ──────────────────────────
  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: dotnet-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: dotnet-${{ runner.os }}-

      - run: dotnet restore Workspace.sln

      - name: Format check
        run: dotnet format Workspace.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Workspace.sln --no-restore

      - name: Unit tests + coverage
        run: >
          dotnet test nars-tests/NarsApi.Tests.csproj
          --no-restore
          --filter "Category!=Service"
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=${{ github.workspace }}/coverage.cobertura.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-coverage
          path: coverage.cobertura.xml
          if-no-files-found: ignore

  # ─── Frontend (nars-web) ────────────────────────────────────
  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nars-web/package-lock.json

      - run: npm ci
        working-directory: nars-web

      - name: Type-check
        run: npm run typecheck
        working-directory: nars-web

      - name: Lint (ESLint + Prettier)
        run: npm run lint
        working-directory: nars-web

      - name: Lint (Stylelint)
        run: npm run lint:css
        working-directory: nars-web

      - name: Build
        run: npm run build
        working-directory: nars-web

      - name: Unit tests
        run: npm run test:run
        working-directory: nars-web

      - name: Audit
        run: npm run audit
        working-directory: nars-web

  # ─── Roads type-check (nars-roads) ────────────────────────
  roads:
    name: Roads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mypy
        run: pip install mypy==2.1.0

      - name: Mypy
        run: mypy app/ tests/
        working-directory: nars-roads

  # ─── Infra lint (delegates to `make infra-lint`) ─────────────
  # The Makefile owns the gate list and the exact tool versions/digests
  # (see make/quality.mk + the *_IMAGE vars). CI must not hand-roll a second
  # copy of that logic — it drifted before (missed the sql/nginx gates, had
  # stale hadolint/checkmake versions, and skipped the hadolint config).
  # `make infra-lint` runs all 11 gates, using the digest-pinned tool images
  # via the docker fallback branches (the runner has docker; only `node` is
  # provided locally for the .mjs gate, matching NODE_IMAGE node:22-alpine).
  infra-lint:
    name: Infra lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run make infra-lint (all 11 gates)
        run: make infra-lint
