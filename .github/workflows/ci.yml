name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── .NET API + Tests ──────────────────────────────────────────────────
  nars-api:
    name: ".NET API"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nars-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Format check
        run: dotnet format Workspace.sln --verify-no-changes --no-restore
        working-directory: .

      - name: Unit tests
        run: >
          dotnet test ../nars-tests/NarsApi.Tests.csproj
          --no-restore
          --filter "Category!=Service"
          --logger "trx;LogFileName=unit.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nars-api-unit-results
          path: "**/*.trx"
          retention-days: 7

  # ── Vue 3 Frontend ───────────────────────────────────────────────────
  nars-web:
    name: "Vue Frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nars-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nars-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

  # ── Python Segmentation Service ──────────────────────────────────────
  nars-roads:
    name: "Python Service"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nars-roads
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gdal-bin libgdal-dev libgl1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Type check
        run: mypy app/

      - name: Lint
        run: |
          pip install ruff
          ruff check app/ tests/

      - name: Test
        run: pytest -q tests/ --cov=app --cov-report=term-missing --cov-fail-under=85

  # ── Infrastructure Linting ───────────────────────────────────────────
  infra-lint:
    name: "Infra Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Makefile validation
        run: make -n help

      - name: Shell script lint
        run: docker run --rm -v "$PWD:/mnt" koalaman/shellcheck:v0.11.0 /mnt/nars-infra/scripts/create_national_admin.sh

      - name: Dockerfile lint
        run: |
          docker run --rm -v "$PWD:/mnt" hadolint/hadolint:v2.12.0 \
            hadolint /mnt/nars-infra/docker/Dockerfile.*

      - name: YAML lint
        run: |
          docker run --rm -v "$PWD:/mnt" cytopia/yamllint:1 \
            yamllint -d relaxed \
              /mnt/nars-infra/k8s/*.yaml \
              /mnt/nars-infra/helm/values-*.yaml \
              /mnt/nars-roads/app/config.yaml

      - name: Python lint (infra scripts + roads)
        run: |
          pip install ruff
          ruff check nars-infra/scripts/ nars-roads/app/ nars-roads/tests/
          ruff format --check nars-infra/scripts/ nars-roads/app/ nars-roads/tests/

      - name: Node syntax check
        run: for f in nars-infra/scripts/*.mjs; do node --check "$f"; done
