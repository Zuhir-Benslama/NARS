name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  security-events: write

jobs:
  backend-lint:
    name: Backend — Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Workspace.sln

      - name: Build
        run: dotnet build Workspace.sln --no-restore --configuration Release

      - name: Check formatting
        run: dotnet format Workspace.sln --verify-no-changes --no-restore

      - name: Run tests
        run: dotnet test Workspace.sln --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~Integration"

  infra-lint:
    name: Infra — Shell, Docker & YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck yamllint
          wget -qO /tmp/hadolint "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64"
          chmod +x /tmp/hadolint
          sudo mv /tmp/hadolint /usr/local/bin/hadolint

      - name: Lint shell scripts
        run: make infra-lint-shell

      - name: Lint Dockerfiles
        run: make infra-lint-docker

      - name: Lint K8s YAML
        run: make infra-lint-yaml

  security-scan:
    name: Security — Gitleaks + Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: GitLeaks — secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: .NET dependency audit
        run: dotnet list package --vulnerable 2>&1 | tail -20 || true

  integration-tests:
    name: Backend — Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore Workspace.sln

      - name: Build
        run: dotnet build Workspace.sln --no-restore --configuration Release

      - name: Run integration tests
        run: dotnet test Workspace.sln --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName~Integration" --logger "trx"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration Test Results
          path: "**/TestResults/*.trx"
          reporter: dotnet-trx

  frontend-lint:
    name: Frontend — Typecheck, Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nars-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: nars-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests (with coverage threshold enforcement)
        run: npm run test:coverage

      - name: Audit dependencies
        continue-on-error: true
        run: npm run audit

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

  docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-lint, integration-tests, security-scan, infra-lint]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: zuhirbenslama/nars-api
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: nars-infra/docker/Dockerfile.nars-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate nars-vite metadata
        id: meta-vite
        uses: docker/metadata-action@v5
        with:
          images: zuhirbenslama/nars-vite
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push vite image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: nars-infra/docker/Dockerfile.nars-vite
          push: true
          tags: ${{ steps.meta-vite.outputs.tags }}
          labels: ${{ steps.meta-vite.outputs.labels }}

      - name: Generate nars-postgis metadata
        id: meta-postgis
        uses: docker/metadata-action@v5
        with:
          images: zuhirbenslama/nars-postgis
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push postgis image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: nars-infra/docker/Dockerfile.nars-postgis
          push: true
          tags: ${{ steps.meta-postgis.outputs.tags }}
          labels: ${{ steps.meta-postgis.outputs.labels }}

      - name: Generate nars-backup metadata
        id: meta-backup
        uses: docker/metadata-action@v5
        with:
          images: zuhirbenslama/nars-backup
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backup image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: nars-infra/docker/Dockerfile.nars-backup
          push: true
          tags: ${{ steps.meta-backup.outputs.tags }}
          labels: ${{ steps.meta-backup.outputs.labels }}
