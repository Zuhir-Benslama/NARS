name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # ─── .NET (nars-api + nars-tests) ──────────────────────────
  dotnet:
    name: .NET
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: dotnet-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: dotnet-${{ runner.os }}-

      - run: dotnet restore Workspace.sln

      - name: Format check
        run: dotnet format Workspace.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Workspace.sln --no-restore

      - name: Unit tests + coverage
        run: >
          dotnet test nars-tests/NarsApi.Tests.csproj
          --no-restore
          --filter "Category!=Service"
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=${{ github.workspace }}/coverage.cobertura.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-coverage
          path: coverage.cobertura.xml
          if-no-files-found: ignore

  # ─── Frontend (nars-web) ────────────────────────────────────
  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nars-web/package-lock.json

      - run: npm ci
        working-directory: nars-web

      - name: Type-check
        run: npm run typecheck
        working-directory: nars-web

      - name: Lint (ESLint + Prettier)
        run: npm run lint
        working-directory: nars-web

      - name: Lint (Stylelint)
        run: npm run lint:css
        working-directory: nars-web

      - name: Build
        run: npm run build
        working-directory: nars-web

      - name: Unit tests
        run: npm run test:run
        working-directory: nars-web

      - name: Audit
        run: npm run audit
        working-directory: nars-web

  # ─── Roads type-check (nars-roads) ────────────────────────
  roads:
    name: Roads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mypy
        run: pip install mypy

      - name: Mypy
        run: mypy app/ tests/
        working-directory: nars-roads

  # ─── Infra lint (shell, docker, yaml, python, node, make) ──
  infra-lint:
    name: Infra lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install lint tools
        run: |
          pip install yamllint ruff

          # shellcheck
          SC_VERSION=v0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/shellcheck-${SC_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin shellcheck-${SC_VERSION}/shellcheck

          # hadolint
          HL_VERSION=v2.12.0
          sudo curl -fsSL -o /usr/local/bin/hadolint "https://github.com/hadolint/hadolint/releases/download/${HL_VERSION}/hadolint-Linux-x86_64" \
            && sudo chmod +x /usr/local/bin/hadolint

          # checkmake
          CM_VERSION=v0.3.2
          curl -fsSL -o /usr/local/bin/checkmake "https://github.com/checkmake/checkmake/releases/download/${CM_VERSION}/checkmake-${CM_VERSION}.linux.amd64" \
            && sudo chmod +x /usr/local/bin/checkmake

      - name: Shellcheck
        run: shellcheck nars-infra/scripts/*.sh

      - name: Hadolint
        run: hadolint --failure-threshold error nars-infra/docker/Dockerfile.*

      - name: Yamllint
        run: >
          yamllint -c nars-infra/.yamllint.yaml
          nars-infra/k8s/*.yaml
          nars-infra/k8s/helm-values/*.yaml
          nars-infra/roads/*.yaml

      - name: Ruff
        run: |
          ruff check nars-infra/scripts/ nars-roads/app/ nars-roads/tests/
          ruff format --check nars-infra/scripts/ nars-roads/app/ nars-roads/tests/

      - name: Node syntax check
        run: |
          for f in nars-infra/scripts/*.mjs; do node --check "$f"; done

      - name: Makefile syntax
        run: |
          make -n help > /dev/null 2>&1
          echo "✓ Makefile syntax OK"

      - name: Undefined variables
        run: |
          make -Rr --warn-undefined-variables -n help 2>&1 \
            | grep -i 'warning.*undefined' | grep -v GNUMAKEFLAGS \
            && { echo "✖ Undefined variable references found"; exit 1; } \
            || echo "✓ No undefined variable references"

      - name: Checkmake
        run: checkmake --config=checkmake.ini Makefile

      - name: Tag guard
        run: |
          DEPLOY_ENV=production IMAGE_TAG=latest ALLOW_LATEST= make _check-pinned-tag 2>/dev/null && {
            echo "✖ _check-pinned-tag unexpectedly accepted latest in production"
            exit 1
          } || echo "✓ latest rejected in production"

          DEPLOY_ENV=production IMAGE_TAG=abc123 ALLOW_LATEST= make _check-pinned-tag
          echo "✓ pinned tag accepted in production"

          DEPLOY_ENV=production IMAGE_TAG='a`rm`b' ALLOW_LATEST= make _check-pinned-tag 2>/dev/null && {
            echo "✖ _check-pinned-tag unexpectedly accepted hostile tag"
            exit 1
          } || echo "✓ hostile tag rejected"

          DEPLOY_ENV=production IMAGE_TAG=latest ALLOW_LATEST=1 make _check-pinned-tag
          echo "✓ ALLOW_LATEST=1 override accepted"

      - name: Local ingress guard
        run: |
          DEPLOY_ENV=production make _check-local-ingresses 2>/dev/null && {
            echo "✖ _check-local-ingresses unexpectedly accepted local ingresses in production"
            exit 1
          } || echo "✓ local ingresses rejected in production"

          DEPLOY_ENV=dev make _check-local-ingresses
          echo "✓ local ingresses allowed in dev"
