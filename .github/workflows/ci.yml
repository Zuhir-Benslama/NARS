---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # ─── .NET (nars-api + NarsApi.Tests) ───────────────────────
  dotnet:
    name: .NET
    # Pinned (not ubuntu-latest, which is a moving label). Infra-lint and the
    # tag/local-ingress/observability guards rely on the runner's preinstalled
    # kubectl + kustomize; pinning keeps their versions (and everything else)
    # reproducible across the matrix.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: dotnet-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: dotnet-${{ runner.os }}-

      - run: dotnet restore Workspace.sln

      - name: Format check
        run: dotnet format Workspace.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Workspace.sln --no-restore

      # The Makefile owns the unit coverage gate (`make test-coverage`): it
      # applies the `Category!=Service` filter and the coverlet Threshold from
      # nars-api/NarsApi.Tests/NarsApi.Tests.csproj. CI delegates rather than hand-rolling a
      # second copy (same principle as the infra-lint and segma-test jobs).
      - name: Unit tests + coverage (make test-coverage)
        run: make test-coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-coverage
          path: nars-api/NarsApi.Tests/TestResults/coverage.cobertura.xml
          if-no-files-found: ignore

  # ─── Frontend (nars-web) ────────────────────────────────────
  web:
    name: Frontend
    runs-on: ubuntu-24.04
    # Hard cap for the whole job so a stalled npm registry lookup can't hang
    # CI indefinitely (npm ci / npm audit hit registry.npmjs.org, which is
    # occasionally slow on hosted runners).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nars-web/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci
        working-directory: nars-web
        timeout-minutes: 15

      # The API contract (`api-spec/openapi.json`) is committed so codegen is
      # deterministic and diffable in PRs. Regenerate the client types from the
      # committed spec and fail if the committed schema.d.ts has drifted —
      # this is what catches "my changes moved an endpoint" without needing a
      # live backend in CI.
      - name: API types in sync with committed spec
        run: npm run codegen:types && git diff --exit-code -- src/api/schema.d.ts
        working-directory: nars-web

      - name: Type-check
        run: npm run typecheck
        working-directory: nars-web

      - name: Lint (ESLint + Prettier)
        run: npm run lint
        working-directory: nars-web

      - name: Lint (Stylelint)
        run: npm run lint:css
        working-directory: nars-web

      - name: Build
        run: npm run build
        working-directory: nars-web

      - name: Unit tests + coverage (thresholds enforced)
        run: npm run test:coverage
        working-directory: nars-web

      - name: Audit
        run: npm run audit
        working-directory: nars-web
        # npm audit does a live registry lookup which can stall on flaky
        # runner networking; fail fast with a clear error instead of hanging
        # the whole job until the run-level concurrency cancel kills it.
        timeout-minutes: 3

  # ─── Frontend e2e (nars-web) ─────────────────────────────────
  # Playwright browser tests (e2e/*.spec.ts) run against the mocked API
  # contract (e2e/test-data.ts). Every /api/* call is intercepted via
  # page.route, so the suite needs only the Vite dev server Playwright
  # starts (webServer in e2e/playwright.config.ts) plus the Chromium
  # binary — no live backend or database. GitHub sets CI=true, which makes
  # the config boot a fresh dev server and retry each test once. The HTML
  # report is uploaded on failure for trace/screenshot debugging.
  web-e2e:
    name: Frontend e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nars-web/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci
        working-directory: nars-web
        timeout-minutes: 15

      # Hosted runners preinstall every Playwright browser system dependency;
      # only the browser binary itself is missing, so a plain install suffices
      # (no --with-deps) — same convention as the docs job's firefox install.
      - name: Install Playwright Chromium browser
        run: npx playwright install chromium
        working-directory: nars-web
        timeout-minutes: 10

      - name: Run Playwright e2e tests
        run: npm run test:e2e
        working-directory: nars-web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-report
          path: nars-web/playwright-report/
          if-no-files-found: ignore

  # ─── Segma test suite (nars-segma) ────────────────────────
  # The gate intentionally lives in the Makefile (`make segma-test`): it builds
  # the test image and runs the exact quality commands — mypy on app/ and
  # tests/ against the real dependency stack, then pytest with a coverage
  # floor. CI delegates to it instead of hand-rolling a second copy (same
  # principle as the infra-lint job); a bare `mypy` install with no deps was
  # near-vacuous because ignore_missing_imports typed the whole stack dynamic.
  segma-test:
    name: Segma test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Run make segma-test (mypy app/tests + pytest w/ coverage floor)
        env:
          # Warm the torch base layer across runs via the GitHub Actions cache.
          # type=gha needs no registry login; mode=max exports every stage layer
          # so the (multi-hundred-MB) pip-install-torch step is cached instead
          # of rebuilt cold on every push. The flags flow into the make target
          # unchanged, so the Makefile stays the single owner of the build.
          SEGMA_TEST_DOCKER_BUILD_ARGS: --cache-from=type=gha --cache-to=type=gha,mode=max
        run: make segma-test

  # ─── Docs ───────────────────────────────────────────────
  # `make docs-lint` runs three gates: docs-lint-uml (renders every ```mermaid
  # block under docs/uml/*.md with the same Playwright-based renderer the
  # Makefile pipeline uses — render-mermaid-playwright.mjs, mermaid pinned to
  # 11.17.2), infra-lint-markdown (markdownlint on docs/*.md + docs/uml/*.md),
  # and infra-lint-uml-drift (asserts the backend class diagram's types/members
  # still exist in nars-api). A mermaid syntax error, stale diagram entry, or
  # broken markdown fails CI instead of surfacing only when someone manually
  # regenerates the (gitignored) PDFs.
  docs:
    name: Docs (UML render)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nars-web/package-lock.json

      # playwright is a nars-web devDependency that the renderer resolves via
      # createRequire(anchor nars-web/package.json). Install it, then fetch the
      # Firefox browser binary the renderer drives (npm ci installs the npm
      # package, not the browsers).
      - name: Install dependencies (npm ci)
        run: npm ci
        working-directory: nars-web
        timeout-minutes: 15

      - name: Install Playwright Firefox browser
        run: npx playwright install firefox
        working-directory: nars-web
        timeout-minutes: 10

      - name: Validate docs (render UML, lint markdown, check drift)
        run: make docs-lint

  # ─── Docs report (LaTeX) ─────────────────────────────────
  # `make docs-tex-lint` depends on docs-tex-image, so one invocation both
  # builds the compile image and compiles docs/nars_documentation.tex (two
  # passes, for TOC/cref) INSIDE that freshly built image. Building first means
  # a Dockerfile/base drift that breaks the rebuild (e.g. a package renamed or
  # removed from tlnet — subcaption and tabularx are not standalone tlpdb names
  # in TL2026) fails CI instead of silently shipping a stale pinned image; and
  # compiling inside the fresh image (not a stale pushed pin) exercises rolling
  # tlmgr package updates against the actual report. The PDF itself is a
  # gitignored artifact regenerated manually (`make docs-tex-pdf`, see
  # make/docs.mk).
  docs-tex:
    name: Docs (LaTeX report)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build image + compile report (make docs-tex-lint)
        env:
          # type=gha warms the base/tlmgr layers across runs so the rebuild
          # stays cheap on repeat pushes (same pattern as the segma-test job).
          DOCS_TEX_DOCKER_BUILD_ARGS: --cache-from=type=gha --cache-to=type=gha,mode=max
        run: make docs-tex-lint

  # ─── Infra lint (delegates to `make infra-lint`) ─────────────
  # The Makefile owns the gate list and the exact tool versions/digests
  # (see make/quality.mk + the *_IMAGE vars). CI must not hand-roll a second
  # copy of that logic — it drifted before (missed the sql/nginx gates, had
  # stale hadolint/checkmake versions, and skipped the hadolint config).
  # `make infra-lint` runs all 14 gates, using the digest-pinned tool images
  # via the docker fallback branches (the runner has docker; only `node` is
  # provided locally for the .mjs gate, matching NODE_IMAGE node:22-alpine).
  # kubectl is set up explicitly (not the runner's preinstalled copy): the
  # local-ingress-guard self-test shells out to `kubectl kustomize`, so the
  # version must not silently drift with the runner image.
  infra-lint:
    name: Infra lint
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.36.4"

      - name: Run make infra-lint (all 14 gates)
        run: make infra-lint

  # ─── Infra utility tests (delegates to `make infra-test-python`) ────────
  # png-to-pdf.py is a host/dev utility whose tests need Pillow + pytest; CI
  # supplies those runner deps (pinned to the local dev versions) and lets the
  # Makefile own the actual test invocation.
  infra-test-python:
    name: Infra utility test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run make infra-test-python
        run: pip install --quiet pillow==12.3.0 pytest==9.0.3 && make infra-test-python
