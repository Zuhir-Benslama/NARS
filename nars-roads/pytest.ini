[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
filterwarnings =
    # Rasterio warns when an in-memory TIFF is written with an identity
    # transform (NotGeoreferencedWarning). The bbox-fallback test does this
    # intentionally to exercise the fallback path — silence the noise.
    ignore::rasterio.errors.NotGeoreferencedWarning
    # torch 2.4 emits DeprecationWarnings from jit._script on import (triggered
    # by importing app.model, which imports torch lazily but still). Library
    # deprecations outside our control; keep the suite output readable. The
    # message is backtick-quoted, so the backticks are part of the pattern.
    ignore:`torch\.jit\.script` is deprecated:DeprecationWarning
    ignore:`torch\.jit\.interface` is deprecated:DeprecationWarning
    # starlette still imports python-multipart under its legacy name; the
    # PendingDeprecationWarning is emitted on import, not by our code.
    ignore:Please use `import python_multipart`:PendingDeprecationWarning
