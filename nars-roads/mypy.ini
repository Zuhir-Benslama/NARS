# Mypy configuration for the nars-roads segmentation service.
#
# The scientific stack (torch, rasterio, shapely, sknw, scikit-image,
# segmentation-models-pytorch) ships without type stubs; ignore_missing_imports
# lets those modules stay dynamically typed while every line of app/*.py that
# we do control is still type-checked. Run from this directory: `mypy app/`
# (or via the `make roads-test` test image, which enforces it before pytest).
[mypy]
python_version = 3.11
ignore_missing_imports = True
