# Mypy configuration for the nars-roads segmentation service.
#
# The scientific stack (torch, rasterio, shapely, sknw, scikit-image,
# segmentation-models-pytorch) ships without type stubs; ignore_missing_imports
# lets those modules stay dynamically typed while every line of app/*.py that
# we do control is still type-checked. Run from this directory: `mypy app/ tests/`
# (or via the `make roads-test` test image, which enforces it before pytest).
#
# python_version tracks the deployed runtime, not the latest release: the
# docker base image and both CI jobs pin 3.11 (see Dockerfile.nars-roads and
# ci.yml). Keeping mypy's target at 3.11 ensures syntax we ship never exceeds
# what actually runs in the container.
#
# follow_imports = skip stops mypy from parsing imported packages. At the
# default (normal), mypy parses every transitively imported module, and a
# modern dev interpreter (3.13/3.14) installs post-3.12 versions of stack
# deps (e.g. tifffile's PEP 695 `type` statements) whose syntax is invalid at
# python_version 3.11 — a parse error that aborts the whole run before
# app/ or tests/ are ever checked. `skip` treats those imports as Any instead
# (consistent with ignore_missing_imports), while every module passed on the
# command line — all of app/ and tests/, including cross-imports between
# them — is still fully type-checked.
[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = skip