<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NARS - National Addressing Reference System</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
    <link rel="stylesheet" href="app.css" />

    <!--
        Import map: lets all JS modules use bare specifiers like `import { ... } from 'vue'`
        without a build tool. Served by the browser natively.
    -->
    <script type="importmap">
    {
        "imports": {
            "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
        }
    }
    </script>
</head>
<body>

    <!--
        #map is intentionally OUTSIDE #app.
        Leaflet manages its own DOM — if #map were inside the Vue root, Vue's
        virtual DOM reconciliation could conflict with Leaflet's direct DOM writes.
    -->
    <div id="map"></div>

    <!--
        #app is the Vue root. All UI overlays (phase bar, modals, info panel,
        profile menu) mount here as Vue components.
        v-cloak hides #app until Vue has finished rendering to avoid a flash
        of unstyled/empty template content.
    -->
    <div id="app" v-cloak></div>

    <!-- Leaflet must load before main.js, which imports map.js that uses L.* -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <!-- Vue app entry point (ES module) -->
    <script type="module" src="js/main.js"></script>

</body>
</html>
