<body>

    <div id="map"></div>
    <div id="app" v-cloak></div>

    <!--
        Leaflet and leaflet-draw are loaded from CDN as plain scripts BEFORE the
        Vue module. This guarantees window.L exists when leaflet-draw initialises,
        which is required because leaflet-draw is a legacy UMD bundle that patches
        the global L object — it cannot be safely imported via npm/Vite.
    -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
