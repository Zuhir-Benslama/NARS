# checkmake configuration (https://github.com/checkmake/checkmake)
# Run via `make infra-lint-checkmake` (local binary or digest-pinned container).

[maxbodylength]
# Default is 5; the deploy/smoke recipes are legitimately longer (multi-step
# kubectl orchestration with failure diagnostics).
maxBodyLength = 50

[minphony]
# checkmake does not resolve `-include`, so `clean` (make/cluster.mk) and
# `test` (make/tests.mk) are invisible to it — listing them here would
# permanently fail the root Makefile. Enforce the entry points the root file
# actually defines. The make/*.mk fragments are intentionally NOT passed to
# checkmake for the same reason.
required = help,all
