<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Content Security Policy:
         script-src 'unsafe-inline' required for this static HTML page.
         In PRODUCTION the server MUST replace with a per-request nonce.
         connect-src is same-origin only — the login form posts to /api on
         this origin; no third-party endpoints are legitimate here. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';"
    />
    <!-- CSRF token — set by the server. Client reads it and sends X-CSRF-Token on non-GET requests. -->
    <meta name="csrf-token" content="" />
    <title>Login - NARS</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="container">
      <div class="form-container">
        <div class="logo">
          <h1>🗺️ NARS</h1>
          <p>National Addressing Reference System</p>
        </div>

        <!-- Sign In Form -->
        <form id="signinForm">
          <div class="error-message" id="signinError"></div>

          <div class="form-group">
            <label for="signin-username">Username</label>
            <input type="text" id="signin-username" required maxlength="50" />
          </div>

          <div class="form-group">
            <label for="signin-password">Password</label>
            <input type="password" id="signin-password" required maxlength="128" />
          </div>

          <button type="submit" class="btn">Sign In</button>
        </form>
      </div>
    </div>

    <script>
      const signinForm = document.getElementById("signinForm")
      const signinError = document.getElementById("signinError")

      function csrfHeaders() {
        const token = document.querySelector('meta[name="csrf-token"]')?.content
        return token ? { "X-CSRF-Token": token } : {}
      }

      signinForm.addEventListener("submit", async (e) => {
        e.preventDefault()

        const username = document.getElementById("signin-username").value
        const password = document.getElementById("signin-password").value
        signinError.style.display = "none"

        try {
          const response = await fetch("/api/signin", {
            credentials: "include",
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              ...csrfHeaders(),
            },
            body: JSON.stringify({ username, password }),
          })

          if (response.ok) {
            // Redirect to map
            window.location.href = "/map"
          } else {
            // Status-mapped generic messages only. Echoing data.detail here
            // would surface internal details (lockout reasons, user-existence
            // hints from upstream identity errors) to unauthenticated users.
            const lang = localStorage.getItem("nars_lang") || "en"
            const s = STRINGS[lang] || STRINGS.en
            signinError.textContent =
              response.status === 429
                ? s.errTooMany
                : response.status === 401 || response.status === 400
                  ? s.errInvalid
                  : s.errGeneric
            signinError.style.display = "block"
          }
        } catch (error) {
          signinError.textContent = "Error connecting to server"
          signinError.style.display = "block"
        }
      })
    </script>

    <!-- ── Language + Theme controls ─────────────────────────────────── -->
    <div class="login-controls">
      <select class="lc-select" id="langSelect">
        <option value="en">🌐 EN</option>
        <option value="fr">🌐 FR</option>
        <option value="ar">🌐 عر</option>
      </select>
      <select class="lc-select" id="themeSelect">
        <option value="light">☀️ Light</option>
        <option value="dark">🌙 Dark</option>
        <option value="auto">🖥️ Auto</option>
      </select>
    </div>

    <script>
      // ── i18n ──────────────────────────────────────────────────────────────────
      const STRINGS = {
        en: {
          username: "Username",
          password: "Password",
          btnSignIn: "Sign In",
          errInvalid: "Invalid username or password",
          errTooMany: "Too many attempts. Please try again later.",
          errGeneric: "Sign-in failed. Please try again.",
          errServer: "Error connecting to server",
        },
        fr: {
          username: "Nom d'utilisateur",
          password: "Mot de passe",
          btnSignIn: "Se connecter",
          errInvalid: "Nom d'utilisateur ou mot de passe invalide",
          errTooMany: "Trop de tentatives. Veuillez réessayer plus tard.",
          errGeneric: "Échec de la connexion. Veuillez réessayer.",
          errServer: "Erreur de connexion au serveur",
        },
        ar: {
          username: "اسم المستخدم",
          password: "كلمة المرور",
          btnSignIn: "دخول",
          errInvalid: "اسم المستخدم أو كلمة المرور غير صحيحة",
          errTooMany: "عدد كبير من المحاولات. يرجى المحاولة لاحقاً.",
          errGeneric: "فشل تسجيل الدخول. يرجى المحاولة مرة أخرى.",
          errServer: "خطأ في الاتصال بالخادم",
        },
      }

      function applyLang(lang) {
        const s = STRINGS[lang] || STRINGS.en
        const html = document.documentElement
        html.lang = lang
        html.dir = lang === "ar" ? "rtl" : "ltr"
        localStorage.setItem("nars_lang", lang)

        // Also persist for the map app
        document.querySelector("#signinForm .btn").textContent = s.btnSignIn

        // Sign-in username/password labels
        document.querySelector('label[for="signin-username"]').textContent = s.username
        document.querySelector('label[for="signin-password"]').textContent = s.password

        // Active button state
        const ls = document.getElementById("langSelect")
        if (ls) ls.value = lang
      }

      // ── Theme ─────────────────────────────────────────────────────────────────
      function applyTheme(mode) {
        const html = document.documentElement
        if (mode === "light") {
          html.removeAttribute("data-theme") // light = default, no attribute needed
        } else if (mode === "dark") {
          html.setAttribute("data-theme", "dark")
        } else {
          // auto — match OS preference
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches
          if (prefersDark) html.setAttribute("data-theme", "dark")
          else html.removeAttribute("data-theme")
        }
        localStorage.setItem("nars_theme", mode)
        const ts = document.getElementById("themeSelect")
        if (ts) ts.value = mode
      }

      // ── Init ──────────────────────────────────────────────────────────────────
      const savedLang = localStorage.getItem("nars_lang") || "en"
      const savedTheme = localStorage.getItem("nars_theme") || "light"
      applyLang(savedLang)
      applyTheme(savedTheme)

      document.getElementById("langSelect").addEventListener("change", function () {
        applyLang(this.value)
      })
      document.getElementById("themeSelect").addEventListener("change", function () {
        applyTheme(this.value)
      })
    </script>
  </body>
</html>
