apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgis-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  # ⚠ hostPath is for local dev (kind/minikube) only.
  # For production, replace with a CSI-backed persistent volume
  # (e.g. EBS, GCE PD, Azure Disk, Longhorn, Rook/Ceph).
  hostPath:
    path: /mnt/nars/postgis/data
    type: DirectoryOrCreate
