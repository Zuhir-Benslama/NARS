mode: deployment
# Single replica is acceptable for dev. For production, increase to 2+ and add
# a PodDisruptionBudget to avoid telemetry gaps during node maintenance.
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.120.0

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 512Mi

presets:
  kubernetesEvents:
    enabled: true

ports:
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
          cors:
            allowed_origins:
              - http://localhost:5173
              - http://localhost:8080
              - http://localhost:80
              - http://nars.dz:8080
              - http://nars.dz:80
              - https://nars.dz:8443
              - https://api.nars.dz:8443

  processors:
    batch:
      timeout: 1s
      send_batch_size: 1024

  exporters:
    otlp:
      endpoint: tempo:4317
      tls:
        insecure: true
    loki:
      endpoint: http://loki-gateway:80/loki/api/v1/push
    prometheus:
      endpoint: 0.0.0.0:8889
      resource_to_telemetry_conversion:
        enabled: true
    debug:
      verbosity: basic

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [batch]
        exporters: [otlp, debug]
      metrics:
        receivers: [otlp]
        processors: [batch]
        exporters: [prometheus, debug]
      logs:
        receivers: [otlp]
        processors: [batch]
        exporters: [loki, debug]
